<!doctype html>
<html lang="__HTMLLANG__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0f1012; --bg-2:#16171a; --card:#1b1d21; --card-2:#212429; --sunk:#0a0b0c;
  --ink:#f2f0ed; --ink-2:#a8a6a2; --ink-3:#6e6c69;
  --line:#26282d; --line-2:#1f2126;
  --hot:#e8663c; --hot-soft:#2a1a14; --hot-tint:rgba(232,102,60,.18);
  --drop:#d98b6a;
  --r:14px; --r-lg:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ── 材质层级（2026-09-21）：内容层「平」、浮层「玻璃」，见 docs/design.md §9 ──
     --tonal 是 alpha 底，落在哪一层上都对；--group 是行组 / 卡的底，比 bg 高一阶、不描边；
     --glass 是浮层（播放条 / 词面板 / 菜单 / tab 胶囊）的半透明底，靠 backdrop-filter 出材质。
     深色不投影、不画外沿黑线（暗底上的投影和黑线只会读成脏渐变、浮雕），层级靠一线高光。 */
  --tonal:rgba(255,255,255,.06); --tonal-2:rgba(255,255,255,.11);
  --group:#16171b; --group-2:#1d1f24; --hair:rgba(255,255,255,.085);
  --glass:rgba(24,25,29,.72); --rim:rgba(255,255,255,.14); --edge:rgba(0,0,0,.5); --dock-edge:transparent;
  --seg:rgba(255,255,255,.14); --seg-shadow:none;
  --float:0 14px 44px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); --float-up:none; --rest:none;
  --blur:22px; --thumb:rgba(255,255,255,.16); --thumb-2:rgba(255,255,255,.28);
  --toph:64px;                        /* 顶栏高（通栏玻璃，见 .top）；52 → 64：PM 要它更高、更突出、更有空气感 */
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f5f3; --bg-2:#fff; --card:#fff; --card-2:#faf9f7; --sunk:#eceae6;
  --ink:#1a1917; --ink-2:#5f5d59; --ink-3:#98958f;
  --line:#e6e3de; --line-2:#efedea;
  --hot:#cf5227; --hot-soft:#fdf0ea; --hot-tint:rgba(207,82,39,.12);
  --drop:#a8542f;
  --tonal:rgba(0,0,0,.045); --tonal-2:rgba(0,0,0,.08);
  --group:#fff; --group-2:#faf9f7; --hair:rgba(0,0,0,.06);
  --glass:rgba(252,251,249,.72); --rim:rgba(255,255,255,.95); --edge:rgba(0,0,0,.085); --dock-edge:rgba(0,0,0,.085);
  --seg:#fff; --seg-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --float:0 14px 44px rgba(0,0,0,.13),0 2px 10px rgba(0,0,0,.07); --float-up:0 -10px 36px rgba(0,0,0,.10);
  --rest:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.035);
  --thumb:rgba(0,0,0,.18); --thumb-2:rgba(0,0,0,.32);
}}
:root[data-theme="light"]{
  --bg:#f6f5f3; --bg-2:#fff; --card:#fff; --card-2:#faf9f7; --sunk:#eceae6;
  --ink:#1a1917; --ink-2:#5f5d59; --ink-3:#98958f;
  --line:#e6e3de; --line-2:#efedea;
  --hot:#cf5227; --hot-soft:#fdf0ea; --hot-tint:rgba(207,82,39,.12);
  --drop:#a8542f;
  --tonal:rgba(0,0,0,.045); --tonal-2:rgba(0,0,0,.08);
  --group:#fff; --group-2:#faf9f7; --hair:rgba(0,0,0,.06);
  --glass:rgba(252,251,249,.72); --rim:rgba(255,255,255,.95); --edge:rgba(0,0,0,.085); --dock-edge:rgba(0,0,0,.085);
  --seg:#fff; --seg-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --float:0 14px 44px rgba(0,0,0,.13),0 2px 10px rgba(0,0,0,.07); --float-up:0 -10px 36px rgba(0,0,0,.10);
  --rest:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.035);
  --thumb:rgba(0,0,0,.18); --thumb-2:rgba(0,0,0,.32);
}
*{box-sizing:border-box}
/* 根不滚，内容区自己滚：滚动条归 .app，底部固定的播放条才能铺满整个窗口 ——
   根滚动条在 WebKit 常显滚动条模式下会在窗口右边留一条 fixed 层画不到的槽（PM 截图 2026-09-16）。
   槽常驻（scrollbar-gutter）仍然要：内容一变就出现/消失滚动条，页面宽度跟着跳（PM #7）。 */
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 滚动条：经典常显滚动条（Windows WebView2 / 内置浏览器 / 系统设「始终显示」的 mac）在深色页上是一条白轨道，
   落在玻璃面板里尤其突兀（PM 2026-09-21）。定义成 macOS 覆盖式那种：轨道透明、6px 圆头拇指、hover 才加深。
   只在有鼠标的端定义 —— 手机是系统的覆盖式细条，自定义样式在 Android 上会把它变成常显。
   Chromium 121+ 一旦设了标准属性就忽略 ::-webkit-scrollbar，所以标准属性只给不认伪元素的引擎（Firefox）。 */
@media (hover:hover) and (pointer:fine){
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--thumb-2);background-clip:padding-box}
  @supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}}
}
/* 没有 backdrop-filter 的引擎、或用户关了透明：玻璃退成实色卡，别让浮层透成一片 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:var(--card)} :root[data-theme="light"]{--glass:#fff}
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--glass:#fff}}
}
@media(prefers-reduced-transparency:reduce){
  .tabs,.bar,.panel,.sheet,.pop,.bubble{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card)}
}
.app{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* 底部留白跟着停靠区（播放条 / 词面板 / 建议层）的实际高度走，见 setDockVar() */
.app-in{max-width:960px;margin:0 auto;padding-left:18px;padding-right:18px;
  padding-block:calc(var(--toph) + env(safe-area-inset-top) + 18px) calc(var(--dockh,0px) + 28px)}
/* 停靠区上沿不再渐隐（2026-09-21）：面板是玻璃，内容在它下面继续，本身就是那句话。
   一个页面只有一条滚动条（PM）：词面板 / 队列 / 建议层任一开着，主页面就锁住 ——
   overflow:hidden 藏掉它的滚动条也停掉它的滚动（iOS sheet 的做法，翻列表先收面板）；
   上面的 scrollbar-gutter:stable 在 hidden 下照样留槽，所以开合时页面宽度不跳。 */
body:has(.panel.on,.sheet.on) .app{overflow-y:hidden}

/* 换页：内容淡入上浮一小段，切子栏不重放（见 render 里的 lastRoute） */
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 换页：带方向的左右滑（PM 2026-09-21 —— 原来「旧页瞬间没了、新页从下方淡上来」，再加滚动归零，读成跳）。
   前进（tab 往右走 / 进更深一层）新页从右边 28px 滑入、旧页向左滑出；后退反过来（方向由 routeDir 判）。
   方向类叫 dir-fwd / dir-back —— 曾经叫 back，撞了下面 .back（返回钮）那条规则，整页被排成一枚药丸（WebKit 容器里先露的馅）。
   旧页在滑出的 .2s 里还留在原位（绝对定位、top 抵消掉归零的滚动），不再瞬间消失。
   不做整屏宽的推入：短距 + 淡出就够说清方向，也更轻。减少动态模式整段不做（render 里判，连旧页都不留）。 */
main{position:relative}
.page.out{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
@keyframes in-fwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes in-back{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes out-fwd{to{opacity:0;transform:translateX(-28px)}}
@keyframes out-back{to{opacity:0;transform:translateX(28px)}}
.page.in.dir-fwd{animation:in-fwd .26s var(--ease)}
.page.in.dir-back{animation:in-back .26s var(--ease)}
.page.out.dir-fwd{animation:out-fwd .2s ease-in forwards}
.page.out.dir-back{animation:out-back .2s ease-in forwards}
/* 换子页（创作页那三个页签）滑的只是这一块，外壳不参与 —— 它的位置由 JS 量出来写在 style 上。
   **这里只有左右滑，没有淡化**（PM 2026-09-21）：整页那套是两屏交叉淡化，换子页时两块内容
   一实一虚地叠在同一格里，读成「跳」。新块自带底色、盖在上面，于是任何一帧都只看得见一块。
   底色只在滑的那 0.26s 需要，动完（animationend）把类摘掉，`.swap` 回到不带任何样式的裸块。 */
@keyframes swap-fwd{from{transform:translateX(28px)}to{transform:none}}
@keyframes swap-back{from{transform:translateX(-28px)}to{transform:none}}
@keyframes swap-out-fwd{to{transform:translateX(-28px)}}
@keyframes swap-out-back{to{transform:translateX(28px)}}
/* 底色要连两侧一起补：新块只位移 28px，露在它左边（或右边，看方向）的那一条正是旧块，
   28px 宽也照样看得见字的残片。box-shadow 画在框外，不占几何。 */
.swap.in{position:relative;z-index:2;background:var(--bg);
  box-shadow:-40px 0 0 var(--bg),40px 0 0 var(--bg)}
.swap.in.dir-fwd{animation:swap-fwd .26s var(--ease)}
.swap.in.dir-back{animation:swap-back .26s var(--ease)}
.swap.out{pointer-events:none;z-index:1}
.swap.out.dir-fwd{animation:swap-out-fwd .26s var(--ease) forwards}
.swap.out.dir-back{animation:swap-out-back .26s var(--ease) forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ── 顶栏：通栏玻璃（PM 2026-09-21）——和底栏一对，内容在两条玻璃之间滚。
   固定在视口顶、铺满宽度，内容列仍 960 居中（padding 用 max() 算出列的左右缘）。
   「边」在下沿：一条发丝。刻意压矮（52）—— 桌面容器上面已有一条原生标题栏，这条不能长成第二条。
   玻璃不叠玻璃：右边的 tab 胶囊退成同色填充的分段控件（.tabs）。 */
.top{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--toph) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) max(18px,calc((100% - 960px) / 2 + 18px)) 0;
  display:flex;align-items:center;gap:12px;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
  box-shadow:inset 0 -1px 0 var(--hair)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;flex:none}
/* ── 顶栏记号：裸记号 + 动效（2026-09-21，PM 提三条：去瓦片 / 星与音符动效 / 放歌中更有律动 + 射灯；design.md §9）。
   瓦片撤了（它之前住在一枚 30px 圆角瓦片里）。「裸记号站在玻璃上会被封面色糊掉」（design.md §9）那条判据改由 halo 接：记号背后常驻一圈很淡的暖光当地面；
   放歌时它跟着拍子呼吸，两束射灯从它背后交错扫出来。所有动效只动 transform / opacity。
   --beat 是一拍的时长（暂按 110 BPM；歌的真实速度以后接上就是改这一个数）。 */
:root{--mark:28px; --beat:.545s;
  /* 深色：地面是一圈暖光，射灯是较宽的锥形光束，叠加（screen）—— 暗底上光就是这样 */
  --ray-blend:screen; --ray-a:.34; --halo-a:.40;
  --halo-bg:radial-gradient(circle,#f0834f 0,rgba(240,131,79,.55) 26%,rgba(209,66,95,.16) 52%,transparent 70%);
  --rays-bg:conic-gradient(from 0deg,
    transparent 0 4.5%,#ffb27a 6.5%,#f0834f 7.2%,transparent 9.5%,
    transparent 39.5%,#f0834f 41%,#d1425f 41.8%,transparent 44%,
    transparent 71%,#ff9f6a 73%,#d1425f 73.6%,transparent 76%,transparent 100%);
  --rays2-bg:conic-gradient(from 0deg,
    transparent 0 20.5%,#ffd08a 22.5%,#ffb27a 23.2%,transparent 25%,
    transparent 56.5%,#f0834f 58%,#d1425f 58.6%,transparent 60.5%,transparent 100%)}
/* 浅色：白纸上没有「发光」这回事 —— 地面改成一块更白的光斑（射灯打在纸上的那块），
   把玻璃透上来的封面色在记号背后清掉；光束改成细的、正片叠底的彩色光线，宽锥在白底上只会糊成粉 */
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--ray-blend:multiply;--ray-a:.22;--halo-a:.85;
  --halo-bg:radial-gradient(circle,rgba(255,241,233,.98) 0,rgba(255,255,255,.7) 36%,rgba(255,255,255,0) 68%);
  --rays-bg:conic-gradient(from 0deg,
    transparent 0 5.6%,#f0834f 6.4%,#f0834f 7%,transparent 7.8%,
    transparent 27%,#d1425f 27.8%,#d1425f 28.3%,transparent 29%,
    transparent 41%,#ffb27a 41.8%,#f0834f 42.4%,transparent 43.2%,
    transparent 72%,#d1425f 72.8%,#f0834f 73.3%,transparent 74%,transparent 100%);
  --rays2-bg:conic-gradient(from 0deg,
    transparent 0 20.5%,#f0834f 21.2%,#f0834f 21.6%,transparent 22.3%,
    transparent 57%,#d1425f 57.8%,#d1425f 58.2%,transparent 59%,transparent 100%)}}
:root[data-theme="light"]{--ray-blend:multiply;--ray-a:.22;--halo-a:.85;
  --halo-bg:radial-gradient(circle,rgba(255,241,233,.98) 0,rgba(255,255,255,.7) 36%,rgba(255,255,255,0) 68%);
  --rays-bg:conic-gradient(from 0deg,
    transparent 0 5.6%,#f0834f 6.4%,#f0834f 7%,transparent 7.8%,
    transparent 27%,#d1425f 27.8%,#d1425f 28.3%,transparent 29%,
    transparent 41%,#ffb27a 41.8%,#f0834f 42.4%,transparent 43.2%,
    transparent 72%,#d1425f 72.8%,#f0834f 73.3%,transparent 74%,transparent 100%);
  --rays2-bg:conic-gradient(from 0deg,
    transparent 0 20.5%,#f0834f 21.2%,#f0834f 21.6%,transparent 22.3%,
    transparent 57%,#d1425f 57.8%,#d1425f 58.2%,transparent 59%,transparent 100%)}

.brand b{position:relative;z-index:1}       /* 字压在光上面：射灯扫到字底下，字仍是干净的一块墨 */
.mark{position:relative;z-index:0;width:var(--mark);height:var(--mark);flex-shrink:0;display:block}
.mark>*{position:absolute;pointer-events:none}
.mark .logo{inset:0;width:100%;height:100%;overflow:visible;z-index:2}
/* 地面：一圈暖光。闲置时很淡（只够把记号从封面色里托出来），放歌时按拍子亮 */
.mark .halo{inset:-9px;border-radius:50%;z-index:0;opacity:var(--halo-a);will-change:transform,opacity;background:var(--halo-bg);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
/* 射灯：两张圆盘各画几道锥形光，反向慢扫；径向遮罩让光束在 32px 半径内散掉，不会捅出顶栏 */
.mark .rays,.mark .rays2{inset:-18px;border-radius:50%;z-index:1;opacity:0;mix-blend-mode:var(--ray-blend);will-change:transform,opacity;
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.75) 28%,transparent 66%);
          mask:radial-gradient(circle,#000 0,rgba(0,0,0,.75) 28%,transparent 66%);
  transition:opacity .6s var(--ease)}
.mark .rays{background:var(--rays-bg)}
.mark .rays2{background:var(--rays2-bg)}

.mark .spin,.mark .star,.mark .note,.mark .sp{transform-box:fill-box;transform-origin:center}
.mark .note{transform-origin:38% 64%}      /* 绕音符头摆 */
.mark .sp{opacity:0}

/* 闲置：星慢慢眨、音符轻轻浮、两粒小星偶尔冒一下。周期互质，看久了不重复 */
.mark .star{animation:mk-twinkle 3.6s var(--ease) infinite}
.mark .note{animation:mk-bob 2.9s ease-in-out infinite}
.mark .sp1{animation:mk-spark 5.2s ease-in-out infinite}
.mark .sp2{animation:mk-spark 6.4s ease-in-out infinite;animation-delay:-2.7s}
@keyframes mk-twinkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.07) rotate(-4deg)}}
@keyframes mk-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.7px) rotate(4deg)}}
@keyframes mk-spark{0%,78%,100%{opacity:0;transform:scale(.2) rotate(0deg)}86%{opacity:1;transform:scale(1) rotate(25deg)}93%{opacity:.5;transform:scale(.6) rotate(45deg)}}

/* 放歌：星按拍子「砸」一下再松开、整体左右摇；音符每拍蹦一下；小星在反拍上冒；地面按拍子亮；射灯亮起来交错扫 */
body.playing .mark .spin{animation:mk-sway calc(var(--beat)*4) ease-in-out infinite}
body.playing .mark .star{animation:mk-beat var(--beat) cubic-bezier(.2,.8,.3,1) infinite}
body.playing .mark .note{animation:mk-hop calc(var(--beat)*2) ease-in-out infinite}
body.playing .mark .sp1{animation:mk-pop calc(var(--beat)*8) ease-out infinite;animation-delay:calc(var(--beat)*.5)}
body.playing .mark .sp2{animation:mk-pop calc(var(--beat)*8) ease-out infinite;animation-delay:calc(var(--beat)*4.5)}
body.playing .mark .halo{opacity:.8;animation:mk-glow var(--beat) ease-out infinite}
body.playing .mark .rays{opacity:var(--ray-a);animation:mk-sweep calc(var(--beat)*14) ease-in-out infinite alternate}
body.playing .mark .rays2{opacity:calc(var(--ray-a)*.8);animation:mk-sweep2 calc(var(--beat)*18) ease-in-out infinite alternate}
@keyframes mk-beat{0%{transform:scale(1)}9%{transform:scale(1.1)}60%{transform:scale(.985)}100%{transform:scale(1)}}
@keyframes mk-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes mk-hop{0%,100%{transform:translateY(0) rotate(-7deg)}25%{transform:translateY(-1.2px) rotate(-2deg)}50%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-1.2px) rotate(2deg)}}
@keyframes mk-pop{0%{opacity:0;transform:scale(.2)}12%{opacity:.85;transform:scale(.9) rotate(15deg)}40%{opacity:0;transform:scale(.4) rotate(40deg)}100%{opacity:0;transform:scale(.2)}}
@keyframes mk-glow{0%{opacity:.8;transform:scale(1.08)}100%{opacity:var(--halo-a);transform:scale(1)}}
@keyframes mk-sweep{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes mk-sweep2{from{transform:rotate(16deg)}to{transform:rotate(-22deg)}}

/* 减少动态：一切不动，射灯不出（静止的光束读成故障）；地面那圈淡光留着，它是记号的地 */
@media(prefers-reduced-motion:reduce){
  .mark .halo,.mark .rays,.mark .rays2,.mark .logo *{animation:none!important}
  .mark .rays,.mark .rays2{display:none}}
.brand b{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
/* 三枚 tab：同色填充的分段控件，选中的那枚是一颗更亮的药丸。
   它坐在玻璃顶栏上，所以自己不能再是玻璃（曾是玻璃胶囊，2026-09-21 顶栏通栏后退成填充）。 */
.tabs{display:flex;gap:2px;padding:3px;margin-left:auto;border-radius:999px;background:var(--tonal);flex:none}
.tab{padding:6px 14px;border-radius:999px;border:0;background:transparent;white-space:nowrap;
  color:var(--ink-3);cursor:pointer;transition:.16s;font-size:13.5px;font-weight:500}
.tab:hover{color:var(--ink-2)}
.tab:active{transform:scale(.96)}
.tab[aria-selected="true"]{background:var(--seg);color:var(--ink);box-shadow:var(--seg-shadow)}

h2.big{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:8px 0 12px}
p.lede{color:var(--ink-3);font-size:13.5px;margin:-6px 0 16px;max-width:46em}
.fine{margin:26px 0 0;text-align:center;font-size:12px;color:var(--ink-3)}
.fine a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}

/* 返回：详情页顶上的一枚小胶囊，跟 app 的返回键一个位置 */
/* 底下留 10px：它 hover 会亮出一枚药丸底，贴着下一块内容就连成一片了（PM 2026-09-17） */
/* 后台入口：只有主人看得见（DATA.isOwner），跟在首页出处那行后面。
   它是主人自己的一件工具，不该长成产品的第四个功能 */
.owner-link{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line);transition:.16s}
.owner-link:hover{color:var(--hot);border-color:var(--hot)}
.back{display:inline-flex;align-items:center;gap:2px;margin:6px 0 10px -8px;padding:5px 11px 5px 5px;border-radius:999px;
  border:0;background:transparent;color:var(--ink-2);font-size:13.5px;cursor:pointer;transition:.16s;max-width:100%}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:17px;height:17px;flex-shrink:0}
.back:hover{background:var(--card);color:var(--ink)}
.back:active{transform:scale(.97)}

/* ── 首页 ── */
.hero{text-align:center;padding:36px 0 22px}
.hero .logo{width:60px;height:60px;margin-bottom:14px}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px}
.hero p{color:var(--ink-2);font-size:14.5px;margin:0 auto;max-width:30em;line-height:1.75}
.nav3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:22px}
.navc{background:var(--group);border:0;box-shadow:var(--rest);border-radius:var(--r-lg);padding:18px 18px 16px;
  cursor:pointer;transition:.18s var(--ease);text-align:left}
.navc:hover{box-shadow:var(--float);transform:translateY(-2px)}
.navc:active{transform:translateY(0) scale(.985)}
.navc .ic{display:block;width:26px;height:26px;margin-bottom:10px;color:var(--hot)}
.navc .ic svg{width:100%;height:100%}
.navc b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.navc span{color:var(--ink-3);font-size:13px;line-height:1.6;display:block}
.mini svg{width:14px;height:14px}
.mini.dl{text-decoration:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
a.btn svg{width:15px;height:15px}

/* ── 封面 ── */
.art{position:relative;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--sunk)}
.art svg{display:block;width:100%;height:100%}
/* 封面还在路上的那一格（PM 2026-09-21：「极简不突出但不简陋」）。只给**真有封面**的那一支
   （`.art.ph`）—— 没封面的走按名字生成的那张图，本来就不该再叠一枚音符上去。
   底是一道极轻的斜向渐变（现成的两枚 token，浅色 #fff→#eceae6、深色 #16171b→#0a0b0c），
   比一块平的 --sunk 有一点光；中间一枚音符说明「这一格是封面」，用 mask 上色所以深浅自动跟着 token 走。
   刻意没拿那张按名字生成的彩图当底：它一亮一变会「闪」，而这一格的职责只是**占住位置**。
   记号画在 img 下面，图到了自然被盖住，不用再判一次状态。 */
.art.ph{background:linear-gradient(145deg,var(--group),var(--sunk))}
.art.ph::after{content:"";position:absolute;inset:0;pointer-events:none;
  -webkit-mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='8.65' cy='16.9' r='3.1'/><path d='M11.75 16.9V4.9l5.8 1.7v3.3' fill='none' stroke='%23000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/34% no-repeat;
  mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='8.65' cy='16.9' r='3.1'/><path d='M11.75 16.9V4.9l5.8 1.7v3.3' fill='none' stroke='%23000' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/34% no-repeat;
  background:var(--ink-3);opacity:.2}
/* 封面还在 JS 里取的那几秒，<img> 是没有 src 的（见 coverImg）—— WebKit 会给这种「缺图」的 img 画一圈
   浅色占位框，Chromium 不画，所以只在容器里看得见（PM 2026-09-21：载入过程边框有瑕疵）。
   图没到就整个藏掉，让 .art 自己的底色当加载态；到了再淡入（onload 挂 .ok）。
   内存里已有的封面直接带 .ok 出生 —— 播放条每次重绘都重建 <img>，缓存命中的不该再淡一次。
   取不到的就一直藏着：留一块干净的底，不留一个破图标。 */
.art img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s var(--ease)}
.art img.ok{opacity:1}
/* 同一项目内的版本共用项目封面，靠角标区分（PM #5：别用无意义的随机图） */
.art .badge{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
  font-family:var(--num);font-size:10px;font-weight:600;padding:2px 6px;border-radius:7px 0 0 0;
  backdrop-filter:blur(3px);letter-spacing:.02em}

/* ── 列表项：一个圆角组，行之间发丝分隔（从文字那一列起，封面不压线），行本身不描边 ── */
.song{display:flex;gap:13px;align-items:center;padding:11px 12px;border-radius:0;
  background:transparent;border:0;cursor:pointer;transition:.16s;width:100%;text-align:left}
.song:hover{background:var(--group-2)}
.song:active{transform:scale(.995)}
.song.now{background:var(--tonal)}
.song.now:hover{background:var(--tonal-2)}
/* 正在播的那行：左边立一条品牌色。原先只有行尾那枚小柱在变，扫一眼列表认不出是哪一行。 */
.song{position:relative;overflow:hidden}
.song::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--hot);transform:scaleY(0);transform-origin:center;transition:transform .22s ease}
.song.now::before{transform:scaleY(1)}
.song+.song::after{content:"";position:absolute;left:77px;right:0;top:0;height:1px;background:var(--hair)}
.song.q+.song.q::after{left:70px}
.song .art{width:52px;height:52px}
.song-mid{flex:1;min-width:0}
.song-t{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:7px}
.song-t .chip{font-weight:500;flex-shrink:0}
.song-s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.song-r{flex-shrink:0;display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:0;background:var(--group);border-radius:var(--r-lg);box-shadow:var(--rest);overflow:hidden}
.group+.group{margin-top:22px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.more{border:0;background:transparent;color:var(--ink-2);font-size:12.5px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.14s}
.more:hover{background:var(--card);color:var(--ink)}
/* 行尾那排圆钮：静息只留字形，hover 才出一枚同色底盘；在放的那枚是橙字 + 橙透明底 */
.mini{width:30px;height:30px;border-radius:50%;border:1px solid transparent;background:transparent;
  cursor:pointer;display:grid;place-items:center;transition:.16s;flex-shrink:0;color:var(--ink-3)}
.mini>svg{display:block}
.mini:hover{background:var(--tonal-2);color:var(--ink)}
.mini:active{transform:scale(.92)}
/* 喜欢是个情绪动作，值得一下回弹 —— 只在"刚点上"时放，取消不放（那是收回，不是庆祝） */
@keyframes heartpop{0%{transform:scale(1)}38%{transform:scale(1.28)}100%{transform:scale(1)}}
.mini.heart.pop{animation:heartpop .32s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:reduce){.mini.heart.pop{animation:none}}
.mini.on{background:var(--hot);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--hot) 38%,transparent)}
.mini.cur{color:var(--hot);background:var(--hot-tint)}
.mini[aria-pressed="true"]{background:var(--hot-soft);color:var(--hot)}
/* 正在放的那一行：三根跳动的小柱，比一枚静止的暂停图标更像「在响」 */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{display:block;width:2.5px;height:6px;background:currentColor;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}

/* ── 项目卡 ── */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.proj-w{position:relative;display:flex}
.proj{background:var(--group);border:0;box-shadow:var(--rest);border-radius:var(--r-lg);overflow:hidden;padding:0;
  cursor:pointer;transition:.18s var(--ease);text-align:left;display:flex;flex-direction:column;isolation:isolate;
  flex:1 1 auto;min-width:0}
/* 项目那一层的 ⋯，落在卡片的落款行右端。它压在卡片上面（DOM 在后），背景透着卡片色。*/
.proj-more{position:absolute;right:9px;bottom:6px}
.proj:hover{box-shadow:var(--float);transform:translateY(-2px)}
.proj:active{transform:scale(.985)}
/* 封面自己带圆角：靠父级 overflow 裁圆角在 WebKit 上会漏（截图反馈 2026-09-16） */
.proj .art{width:100%;aspect-ratio:1/1;border-radius:var(--r-lg) var(--r-lg) 0 0}
.proj-b{padding:12px 13px 13px}
.proj-t{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.proj-s{font-size:12.5px;color:var(--ink-3);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 落款行：padding-right 给右下那枚 ⋯ 留位（chip 多起来也不会钻到它底下）。
   **换行是整行换，不是把每个词挤成竖条** —— 窄屏两列时一张卡只有 ~163px，
   「生成中 + 12 个版本 + 已分享」三样同时在就放不下；默认的 flex 会去压每个
   子项的宽度，于是「生成中」竖成「生/成/中」。让子项不换行、整行 wrap，
   挤不下就老老实实第二行。（这一条在加 ⋯ 之前就已经会炸成两行，只是没人撞上。） */
.proj-m{margin-top:8px;display:flex;gap:8px;align-items:center;font-family:var(--num);font-size:11px;color:var(--ink-3);
  padding-right:28px;flex-wrap:wrap;row-gap:4px}
.proj-m>*{white-space:nowrap}
.chip{padding:2px 7px;border-radius:999px;background:var(--tonal);font-size:10.5px;font-family:var(--num)}
.chip.on{background:var(--hot-tint);color:var(--hot)}

/* 生成中 ── 一首歌在路上的时候，这件事得看得见 */
.chip.work{background:var(--hot-soft);color:var(--hot)}
.making{display:flex;gap:13px;align-items:center;padding:12px 13px;border-radius:var(--r);
  background:var(--card);border:1px dashed var(--hot);margin-bottom:8px}
.making.failed{border-style:solid;border-color:var(--drop)}
.making.failed .making-t{color:var(--drop)}
.making .art{width:52px;height:52px;opacity:.5}
.making-m{flex:1;min-width:0}
.making-t{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.making-s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mprog{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:7px}
.mprog i{display:block;height:100%;background:var(--hot);border-radius:2px;transition:width .6s linear}
.dot{width:6px;height:6px;border-radius:50%;background:var(--hot);animation:pulse 1.4s ease-in-out infinite}

.empty{border:0;background:var(--tonal);border-radius:var(--r-lg);padding:34px 22px;text-align:center}
.empty h3{font-size:15px;font-weight:600;margin:0 0 5px}
.empty p{color:var(--ink-3);font-size:13px;margin:0 auto;max-width:30em;line-height:1.7}
.empty .btn{margin-top:14px}

/* ── 创作引导 ── */
.quiz{background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r-lg);padding:22px;max-width:640px}
.prog{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--hot);border-radius:2px;transition:width .28s var(--ease)}
.quiz-step{font-family:var(--num);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.quiz-q{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:8px 0 3px}
/* 结构固定：不是每道题都有提示、选项也不是都占两行，而整块跟着长短蹿是最劝退的动静。
   提示行恒占位、选项区按两行留高 —— 换题时只有内容在变，框不动（PM 2026-09-17）。 */
.quiz-h{font-size:13px;color:var(--ink-3);margin:0 0 15px;min-height:1.4em}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px;min-height:78px;align-content:flex-start}
.opt{padding:8px 14px;border-radius:999px;border:1px solid transparent;background:var(--tonal);
  color:var(--ink-2);cursor:pointer;transition:.16s;font-size:13.5px}
.opt:hover{background:var(--tonal-2);color:var(--ink)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.quiz textarea,.field textarea,.field input{width:100%;background:var(--tonal);border:1px solid transparent;
  border-radius:11px;padding:11px 13px;font-size:14px;resize:vertical;transition:.16s}
/* 聚焦：同色纸提亮 + 一圈发丝，不上橙（光标已经是橙的） */
.quiz textarea:focus,.field textarea:focus,.field input:focus{outline:none;background:var(--group);box-shadow:0 0 0 1px var(--tonal-2)}
.quiz textarea::placeholder,.field textarea::placeholder,.field input::placeholder{color:var(--ink-3)}
.quiz-nav{display:flex;gap:9px;margin-top:16px;align-items:center;flex-wrap:wrap}
/* 「跳过」是"这题不答"，和"往前走"不是一类，别挤在一起抢位置 —— 推到右边、降成文字 */
.quiz-skip{margin-left:auto;background:transparent;border:0;color:var(--ink-3);
  font:inherit;font-size:13px;cursor:pointer;padding:8px 4px;border-radius:8px;transition:.16s}
.quiz-skip:hover{color:var(--ink-2)}
.btn{padding:10px 19px;border-radius:11px;border:1px solid var(--hot);background:var(--hot);color:#fff;
  cursor:pointer;transition:.16s;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.32;cursor:default;filter:none}
.btn.ghost{background:var(--tonal);color:var(--ink-2);border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--tonal-2);color:var(--ink);filter:none}
/* 「找她写一首」：整块橙红太重，压过了它上面的歌。改成中性底 + 一枚橙红气泡点题 ——
   颜色留给"正在发生的事"（在播、已喜欢），入口只要认得出是说话就够了。 */
.btn.cta{background:var(--group);color:var(--ink);border-color:transparent;box-shadow:var(--rest);
  display:inline-flex;align-items:center;gap:10px;padding:9px 18px 9px 10px}
.btn.cta:hover:not(:disabled){border-color:transparent;filter:none;box-shadow:var(--float)}
.cta-ic{width:28px;height:28px;border-radius:50%;background:var(--hot);color:#fff;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .18s}
.cta-ic svg{width:15px;height:15px;display:block}
.btn.cta:hover .cta-ic{transform:scale(1.06)}

.seed-out{background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r);overflow:hidden;max-width:640px}
.seed-h{padding:11px 15px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;
  align-items:center;gap:12px}
.seed-l{font-size:12px;color:var(--ink-3)}
.seed-b{padding:14px 16px;font-size:14px;line-height:1.85;white-space:pre-wrap}

/* ── 详情 ── */
.head{display:flex;gap:16px;align-items:center;margin:12px 0 18px}
.head.tight{align-items:flex-start;gap:14px;margin-bottom:14px}
.head.tight .art{width:72px;height:72px}
.head .art{width:96px;height:96px;border-radius:var(--r)}
.head-m{flex:1;min-width:0}
.head-k{font-family:var(--num);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
/* ── 二级导航（PM 2026-09-21）：整页只许有一枚胶囊 —— 顶栏那枚 tab；第二层一律是**一行字**。
   三处共用：发现页首屏（.entry 入口 + .fbtn 筛选）、「我分享的」列表页（.ttabs + .fbtn）、创作页三种方式（.ttabs）。
   .ttabs 文字页签：选中 = 墨 + 2px 品牌下划线（品牌色只标状态；效果图 A，PM 选的），切换时字宽不跳；
   .entry 是「进去看」的入口不是页签：字亮一档、尾巴带 ›，触屏上也认得出能点；
   .fbtn 筛选退成行尾一枚图标钮，选了标签在角上挂个数 —— 它曾是第三枚胶囊。 */
.mine-entry{display:flex;align-items:center;gap:22px;margin:-2px 0 20px;min-height:32px}
.ttabs{display:inline-flex;gap:22px;max-width:100%;overflow-x:auto}
.ttab,.entry{position:relative;border:0;background:transparent;padding:6px 0;font:inherit;font-size:14px;font-weight:500;
  color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:color .16s;display:inline-flex;align-items:center;gap:6px}
.ttab:hover,.entry:hover{color:var(--ink)}
.ttab[aria-selected="true"]{color:var(--ink)}
.ttab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--hot)}
.entry{color:var(--ink-2)}
.entry::after{content:"›";color:var(--ink-3);font-size:15px;line-height:1;margin-left:-2px}
.entry:hover::after{color:var(--ink)}
.entry .n{font-family:var(--num);font-size:12.5px;color:var(--ink-3)}
.fbtn{margin-left:auto;position:relative;width:32px;height:32px;border-radius:50%;border:0;background:var(--tonal);color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;flex-shrink:0}
.fbtn svg{width:15px;height:15px;display:block}
.fbtn:hover{background:var(--tonal-2);color:var(--ink)}
.fbtn:active{transform:scale(.94)}
.fbtn[aria-pressed="true"]{background:var(--hot-tint);color:var(--hot)}
.fbtn .n{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--hot);
  color:#fff;font-family:var(--num);font-size:10px;line-height:16px;text-align:center}
/* 计数嵌在心的右上角，圆环在那儿给它让路（PM 参考稿）—— 并排放会读成两个控件。
   「让路」是拿一块与行同色的底盖掉那一段边框，所以行的三种底色都要跟上，
   否则 hover 的时候缺口会露出错色。pointer-events 交还给心：数字不该拦点击。 */
.likebox{position:relative;display:inline-flex;margin-right:5px}
.likes-n{position:absolute;top:-4px;right:-5px;pointer-events:none;
  font-family:var(--num);font-size:10px;line-height:1;color:var(--ink-3);
  background:var(--group);padding:1.5px 3px;border-radius:999px}
.song:hover .likes-n{background:var(--group-2)}
.song.now .likes-n{background:transparent}
.mini.heart[aria-pressed="true"]+.likes-n{color:var(--hot)}
.song-r .mini.heart[aria-pressed="true"] svg{fill:currentColor}
/* 单曲页：一首歌自己的一屏，可以转发出去。听众视角 —— 和精修页（创作者视角）不是一回事 */
.sp-head{display:flex;gap:18px;align-items:flex-start}
.sp-head .art{flex-shrink:0}
.sp-t{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.sp-by{margin-top:7px;font-size:13px;color:var(--ink-2)}
.sp-desc{margin-top:9px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.sp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.sp-acts{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:20px 0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-family:inherit;
  border:1px solid transparent;background:var(--tonal);color:var(--ink-2);font-size:13px;cursor:pointer;
  transition:.14s;text-decoration:none}
.pill:hover{background:var(--tonal-2);color:var(--ink)}
.pill:active{transform:scale(.97)}
.pill svg{width:15px;height:15px;display:block}
.pill[aria-pressed="true"]{background:var(--hot-soft);color:var(--hot)}
.pill[aria-pressed="true"] svg{fill:currentColor}
.pill.solid{background:var(--hot);color:#fff}
.pill.solid:hover{filter:brightness(1.08);color:#fff;background:var(--hot)}
.pill .n{font-family:var(--num);font-size:12.5px;opacity:.85}
.sp-cta{margin-top:26px;padding-top:20px;border-top:1px solid var(--hair)}
.sp-cta h3{font-size:15px;font-weight:600;margin-bottom:5px}
.sp-cta p{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:13px}
.sp-foot{margin-top:16px;font-size:12px;color:var(--ink-3);line-height:1.6}
/* 单曲页的评论（2026-09-21）。**内容层，所以是平的** —— 没有描边、没有卡片、没有玻璃：
   §9 第一条原则说内容靠底色阶梯 + 发丝分隔 + 留白分层，玻璃只留给真正浮起来的东西
   （播放条 / 面板 / 菜单）。一块留言区要是做成毛玻璃，它就在说自己浮在页面上面，而它不是。
   输入框跟着页面上别的输入走 `--tonal` 填充：alpha 同色，落在哪一层上都对。 */
.cm{margin-top:26px;padding-top:20px;border-top:1px solid var(--hair)}
.cm-h{font-size:15px;font-weight:600;margin-bottom:13px;display:flex;align-items:baseline;gap:7px}
.cm-h .n{font-family:var(--num);font-size:12.5px;color:var(--ink-3);font-weight:400}
.cm-new{display:flex;gap:8px;align-items:flex-end}
.cm-new textarea{flex:1;min-width:0;background:var(--tonal);border:1px solid transparent;border-radius:10px;
  padding:9px 11px;font-size:13.5px;resize:none;overflow:hidden;min-height:38px;line-height:1.5}
.cm-new textarea:focus{outline:none;background:var(--group);box-shadow:0 0 0 1px var(--tonal-2)}
.cm-new .btn{flex:0 0 auto}
/* 字数只在快到头时才出现 —— 一直亮着等于催着人数字数，而 80 字的限制九成时候碰不到。
   占位高度留着，免得它一出现就把下面整列顶一下。 */
.cm-cap{font-size:11.5px;color:var(--ink-3);text-align:right;font-family:var(--num);
  margin:5px 0 0;min-height:15px;transition:color .16s}
.cm-cap.near{color:var(--hot)}
.cm-list{margin-top:16px}
.cm-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--hair)}
.cm-row:first-child{border-top:0;padding-top:2px}
.cm-m{flex:1;min-width:0}
.cm-by{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.cm-by b{color:var(--ink-2);font-weight:500}
/* 留言是别人打的，可能一口气 80 个字不带空格 —— 不断行会把整页撑宽 */
.cm-t{font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.cm-del{flex:0 0 auto;opacity:.45}
.cm-del:hover{opacity:1;color:var(--hot)}
.cm-none{font-size:13px;color:var(--ink-3);margin:14px 0 2px}

.head-t{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 3px;line-height:1.2}
.head.tight .head-t{font-size:22px;margin-top:2px}
.head-s{font-size:13.5px;color:var(--ink-3)}
.head-s b{color:var(--ink-2);font-weight:500}
.form{max-width:640px}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field .opt-req{color:var(--ink-3);font-size:12px}
.tagrow{display:flex;flex-wrap:wrap;gap:7px}
.tag{padding:6px 12px;border-radius:999px;border:1px solid transparent;background:var(--tonal);
  color:var(--ink-3);cursor:pointer;font-size:12.5px;transition:.16s}
.tag:hover{background:var(--tonal-2);color:var(--ink)}
.tag:active{transform:scale(.96)}
.tag[aria-pressed="true"]{background:var(--hot-soft);color:var(--hot)}

/* 筛选面板（发现页 / 两个二级页）：**没有新控件** —— chip 就是 .tag，和分享页上那颗
   「固定旋律」是同一套「可点的椭圆」。
   面板**就地展开，不是浮层**：筛选的结果就在它下面那张列表里，盖住就看不见了。
   一维一行，行首那个维度名是给「这些词是同一类」一个落点 —— 没有它，二十几枚
   chip 平铺下来就是一堆词，组合（韩语 + 摇滚）也就无从下手。 */
.filter{background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r);
  padding:12px 13px 10px;margin:-8px 0 17px;animation:in .18s var(--ease)}
.fil-row{display:flex;gap:11px;align-items:flex-start;margin-bottom:8px}
.fil-k{flex:0 0 26px;font-size:12px;color:var(--ink-3);line-height:29px;white-space:nowrap}
.fil-v{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fil-v .tag{padding:4px 11px;font-size:12px}
.fil-f{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.fil-f .btn{padding:6px 15px;font-size:12.5px}
/* 分享页上的标签是**只读**的：她填的，改要去跟她说（design.md §0.3 / §0.5） */
.sp-tags.ro{margin-top:0}
.field .note{margin:7px 0 0;font-size:12px;color:var(--ink-3);line-height:1.5}
/* 单曲页那几枚标签点得动 —— 行上不画标签，这里是筛选唯一的发现路径 */
.chip.act{border:0;cursor:pointer;color:var(--ink-2);transition:.16s}
.chip.act:hover{background:var(--hot-tint);color:var(--hot)}
.chip.act:active{transform:scale(.96)}

/* ── 歌词 ── */
.lyr-card{background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r);overflow:hidden}
.lyr-h{padding:11px 15px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.lyr-l{font-size:12px;color:var(--ink-3)}
.lyr-a{display:flex;gap:8px;align-items:center}
.lyr-b{padding:4px 16px 16px}
.sec{padding-top:13px}
.sec-h{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.sec-t{font-size:12px;font-weight:600;color:var(--hot);letter-spacing:.01em}
.sec-raw{font-family:var(--num);font-size:10.5px;color:var(--ink-3)}
/* 位置从哪来的那枚小标：安静、不抢，但一直在 —— 它是边界，不是装饰 */
.tmtag{flex-shrink:0;font-size:11px;color:var(--ink-3);border:1px solid transparent;background:var(--tonal);
  border-radius:999px;padding:1px 8px;white-space:nowrap;cursor:default}
.tmtag.loose{color:var(--hot);background:var(--hot-tint);border-color:transparent}
/* 已精校 = 一个事实，不是一个动作：不用品牌色抢戏，只把边框收掉、字沉一档 */
.tmtag.ok{color:var(--ink-2);background:var(--tonal);border-color:transparent}
.tmtag.work{color:var(--hot);background:var(--hot-soft);border-color:transparent}
/* 可以精校 = 唯一能点的那一态，所以它是**按钮**：跟随品牌色，hover 才实心 */
.tmtag.act{cursor:pointer;color:var(--hot);border-color:transparent;background:var(--hot-tint);
  font:inherit;font-size:11px;transition:.14s}
.tmtag.act:hover{background:var(--hot);border-color:var(--hot);color:#fff}
.tmtag.act:active{transform:scale(.96)}
p.lede .tmtag{display:inline-block;margin-left:2px;vertical-align:1px}
.sec-p{font-size:14.5px;line-height:1.95;white-space:pre-wrap}
.after{margin-top:10px;font-size:12px;color:var(--ink-3);line-height:1.7}

/* ── 精修：一句一句地听、一句一句地说 ── */
.lines{display:flex;flex-direction:column;gap:14px}
.lsec{background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r);padding:11px 6px 8px}
.lsec-h{display:flex;align-items:baseline;gap:7px;padding:0 10px 6px}
.lsec-t{margin-left:auto;font-family:var(--num);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;cursor:pointer;
  transition:background .14s;position:relative}
.lrow:hover{background:var(--card-2)}
.lrow.on{background:var(--hot-soft)}
/* 正在唱的那一句 —— 位置是按谱推的，所以用底色轻轻托一下，不做强指示；
   用品牌橙红的透明底（PM 2026-09-16：别用绿，状态色统一） */
.lrow.live{background:var(--hot-tint)}
.lrow.live .ltext{color:var(--ink)}
.ltext{flex:1;min-width:0;font-size:14.5px;line-height:1.6}
.lrow.noted .ltext{color:var(--hot)}
.lnote{flex-shrink:0;max-width:40%;font-size:12px;color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lplay{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:1px solid transparent;
  background:var(--tonal);color:var(--ink-3);display:grid;place-items:center;cursor:pointer;transition:.14s}
.lplay:hover{background:var(--hot-tint);color:var(--hot)}
.lplay.off{border:0}
/* 句尾的气泡：写建议从这里进。展开成一行输入框会把这一列词的节奏打断，
   而且看着像「填完要按确认」——PM 2026-09-16。 */
.lbub{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer;
  opacity:.5;transition:.14s}
.lrow:hover .lbub{opacity:1;background:var(--tonal)}
.lbub:hover{border-color:var(--hot);color:var(--hot);opacity:1}
.lbub.has{opacity:1;background:var(--hot);border-color:var(--hot);color:#fff}
.lbub svg{width:13px;height:13px}
@media(hover:none){.lbub{opacity:.8;background:var(--tonal)}}

/* 悬浮窗：桌面贴着那一句，窄屏落到底部（键盘弹起来也挡不住）。
   同一个壳还做每一版的 ⋯ 菜单（.menu）。 */
.pop{position:fixed;z-index:60;width:min(340px,calc(100vw - 24px));background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);backdrop-filter:blur(var(--blur)) saturate(1.5);
  border:0;border-radius:14px;box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--edge),var(--float);
  padding:12px 13px 11px;animation:popin .18s var(--ease)}
.pop-h{font-size:12px;color:var(--ink-3);margin-bottom:7px;display:flex;gap:8px;align-items:baseline}
.pop-q{color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop textarea{width:100%;background:var(--tonal);border:1px solid transparent;border-radius:10px;
  padding:9px 11px;font-size:13.5px;resize:none;overflow:hidden;min-height:62px}
.pop textarea:focus{outline:none;background:var(--group);box-shadow:0 0 0 1px var(--tonal-2)}
.pop-f{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px}
.pop-x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:12.5px;padding:5px 9px;border-radius:8px}
.pop-x:hover{color:var(--hot);background:var(--hot-soft)}
.pop-x.ok{color:var(--ink);background:var(--tonal-2);font-weight:500}
.pop.menu{width:190px;padding:6px}
.mitem-sep{height:1px;background:var(--hair);margin:5px 7px}
.mitem.bad{color:var(--ink-3)}
.mitem.bad:hover{color:var(--hot);background:var(--hot-soft)}
/* 确认框：比菜单宽一档，居中放 —— 它要人停一下，不该像菜单那样贴着按钮一闪而过 */
.pop.confirm{width:min(320px,calc(100vw - 32px));padding:16px 16px 13px}
.pop-t{font-size:15px;font-weight:600;margin-bottom:6px}
.pop-c{font-size:13px;line-height:1.6;color:var(--ink-3)}
.pop.confirm .pop-f{margin-top:14px;gap:8px}
.btn.sm{padding:7px 15px;font-size:13px;border-radius:9px}
/* 版本分段：项目那一块讲「这是什么歌」，这条线之下讲「它有哪几版」 */
.group-h.vers{border-top:1px solid var(--hair);padding-top:13px;margin-top:2px}
/* 和项目卡片上那句「N 个版本」同一套写法（.proj-m），别另起一档 */
.vers-l{font-family:var(--num);font-size:11px;color:var(--ink-3)}
.mitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:9px;
  background:transparent;color:var(--ink);font-size:13.5px;cursor:pointer;text-decoration:none;text-align:left;transition:.12s}
.mitem:hover{background:var(--card-2)}
.mitem:active{transform:scale(.98)}
.mitem svg{width:16px;height:16px;color:var(--ink-2);flex-shrink:0}
.mitem b{margin-left:auto;font-family:var(--num);font-size:10.5px;font-weight:500;color:var(--hot)}
@media(max-width:640px){.pop,.pop.menu{left:12px!important;right:12px;width:auto;
  top:auto!important;bottom:calc(var(--dockh,0px) + 10px)}
  .pop.menu{padding:8px}
  .mitem{padding:12px 12px;font-size:14.5px}}

/* 常驻的建议气泡：写到哪一页都带着，随时能打开发出去 */
.bubble{align-self:flex-end;margin:0 16px 10px;display:none;align-items:center;gap:8px;
  padding:9px 15px;border-radius:999px;border:0;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
  color:var(--ink);cursor:pointer;box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--edge),var(--float);transition:.16s;
  font-size:13px;pointer-events:auto}
.bubble.on{display:inline-flex;animation:popin .2s var(--ease)}
.bubble:hover{box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--hot),var(--float)}
.bubble:active{transform:scale(.96)}
.bubble b{font-family:var(--num);font-size:12px;color:var(--hot)}
.bubble svg{width:15px;height:15px;color:var(--hot)}
.dock{pointer-events:none}
.dock>*{pointer-events:auto}

.sheet{display:none;position:relative;background:var(--glass);border-top:0;
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);box-shadow:inset 0 1px 0 var(--rim)}
.sheet.on{display:block;animation:up .24s var(--ease)}
.sheet-in{max-width:960px;margin:0 auto;padding:12px 18px 14px;max-height:min(52vh,420px);overflow:auto}
.sheet-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sheet-t{font-size:13.5px;font-weight:600}
.sheet-n{font-size:11.5px;color:var(--ink-3)}
.sitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--hair)}
.sitem-m{flex:1;min-width:0}
.sitem-w{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.sitem-t{font-size:13.5px;line-height:1.55}
.sitem-x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;
  line-height:1;padding:2px 4px;flex-shrink:0}
.sitem-x:hover{color:var(--hot)}
.sheet-f{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
.scorebox{margin-top:18px;background:var(--group);border:1px solid transparent;box-shadow:var(--rest);border-radius:var(--r);
  padding:10px 14px}
.scorebox summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.segline{margin-top:10px}
.abcbox{overflow-x:auto}
.abcbox svg{max-width:100%;height:auto}
/* abcjs 画的是黑色五线谱 —— 不染色在深色底上等于看不见 */
.abcbox svg path,.abcbox svg ellipse,.abcbox svg rect,.abcbox svg text{fill:var(--ink)}
.abcbox svg line{stroke:var(--ink)}

/* ── 播放器：自己画。relay 会剥掉 Accept-Ranges 并转 chunked，
      原生 controls 会把成品曲判成直播（无时长、不能拖）。
      所以整首先取回来再放（fetchBlob）：时长、拖动、播完从头，全都靠本地那份。 ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column}
/* 底栏贯通、直边（PM 2026-09-21 否了悬浮胶囊）：只换材质 —— 半透明 + 模糊 + 上沿一线高光。
   外沿线 + 向上的投影画在 ::before 上、在自己的下沿裁掉（投影不许漏进下面那层玻璃）；
   词面板 / 队列 / 建议层开着时它们和播放条**接成一块**：只有最上面那层画外沿和投影，播放条只留一条发丝接缝。
   深色下 --dock-edge / --float-up 都是空的，只剩高光 —— 暗底上黑线压高光是浮雕、投影是脏渐变（PM「过度感」）。 */
.bar{position:relative;background:var(--glass);border-top:0;
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--rim);
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:none;gap:13px;align-items:center}
.bar::before,.panel.on::before,.sheet.on::before{content:"";position:absolute;left:0;right:0;top:-1px;bottom:0;
  border-top:1px solid var(--dock-edge);box-shadow:var(--float-up);pointer-events:none;z-index:-1;
  clip-path:inset(-80px 0 0 0)}
.panel.on~.bar,.sheet.on~.bar,.sheet.on~.panel.on{box-shadow:inset 0 1px 0 var(--hair)}
.panel.on~.bar::before,.sheet.on~.bar::before,.sheet.on~.panel.on::before{display:none}
.bar.on{display:flex}
.bar.rise{animation:up .28s var(--ease)}
.lyrbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  border:1px solid transparent;background:var(--tonal);color:var(--ink-2);cursor:pointer;
  font-size:12.5px;transition:.16s;flex-shrink:0}

async function coverShrink(f){

     所以**贴顶是必然而不是巧合**：客人那 10 张里 7 张都停在 172–193KB。 */

  let type = "image/webp", out = await blob(type, 0.86);

  return new Uint8Array(await out.arrayBuffer());

   ⚠️ **首档不是「越大越好」，它头顶有一条硬天花板：隧道对 URL 有长度上限。**
   2026-09-20 线上二分实测：URL 总长 10916 B 过、11116 B 不过；超了隧道回 **520**
   （身子是 `error code: 520`），**不是把 URL 截短**。一片 N 字节经 base64 + URL 编码
   最坏约 1.43×N，于是 24576 → 34976 B、12288 → 17518 B 两档**必然**过不去，

    for (let o = off; o < buf.length && batch.length < COVER_LANES; o += CH)

      if (err.kind === "net" && ++retry <= COVER_NET_RETRY) continue;   // 原档重来同一段
      throw err;

    off = last[0] + last[1].length;
    onPct(off);
  }

async function coverChunk(p, id, off, part){

     net = 链路抖了，原档重试；short = 这一档隧道咽不下去，降档；reject = 服务端拒了，直接报。

     **判据是「有没有拿到响应」**：只有 fetch 自己抛才算链路断。拿到了响应但不是 2xx、
     或者身子不是 JSON（隧道的错误页正是这样），一律当这一档太大 —— 降档是廉价的，
     而把它读成网络抖动会死在原地，2026-09-20 的封面全灭就是这么来的。*/

  catch (e){ throw Object.assign(new Error(T("coverNetDown")), {kind: "net"}); }
  let j = null;
  try { j = JSON.parse(await res.text()); } catch (e){ /* 不是 JSON：隧道的错误页 */ }

  return `<img${hit ? ` src="${esc(hit)}" class="ok"` : ""} data-cover="${esc(url)}" alt="" onload="this.classList.add('ok')"${extra || ""}>`;

function soakCovers(){
  for (const el of document.querySelectorAll("img[data-cover]")){
    const u = el.getAttribute("data-cover");
    const hit = COVER_MEM.get(u);
    if (hit){ if (el.src !== hit) el.src = hit; continue; }
    if (COVER_WIP.has(u)) continue;
    COVER_WIP.add(u);
    fetch(u).then(r => r.ok ? r.blob() : null).then(b => {
      COVER_WIP.delete(u);
      if (!b) return;
      if (COVER_MEM.size >= COVER_KEEP){            // 别无限涨：最老的那条让位
        const old = COVER_MEM.keys().next().value;
        URL.revokeObjectURL(COVER_MEM.get(old));
        COVER_MEM.delete(old);
      }
      const o = URL.createObjectURL(b);
      COVER_MEM.set(u, o);
      for (const n of document.querySelectorAll("img[data-cover]"))
        if (n.getAttribute("data-cover") === u) n.src = o;
    }).catch(() => {
      COVER_WIP.delete(u);
      // 取不到就让 <img> 自己按老路子试一次 —— 宁可多一次请求，也别留个空框
      if (!el.src) el.src = u;

  }
}
/* 封面按【项目】生成 —— 同项目的各版本共用它，靠角标区分（PM #5）。

function coverFor(name){
  if (!name) return null;
  for (const p of DATA.projects || []) if ((p.title === name || p.slug === name) && p.cover) return p.cover;
  for (const s of DATA.shared || []) if ((s.project === name || s.title === name) && s.cover) return s.cover;

function art(projectName, size, badge){
  const style = size ? `width:${size};height:${size}` : "";

  if (cv) return `<div class="art ph" style="${style}">${coverImg(cv, ' loading="lazy"')}${
    badge?`<span class="badge">${esc(badge)}</span>`:""}</div>`;
  const box = `<div class="art" style="${style}">`;
  const h = hash(projectName||"?"), hue = h%360, hue2=(hue+38+h%40)%360, rot=h%90, n=3+h%3;
  const rings = Array.from({length:n},(_,i)=>
    `<circle cx="${28+(h>>(i*3))%44}" cy="${24+(h>>(i*4))%52}" r="${13+(h>>(i*2))%24}"
      fill="hsl(${(hue2+i*26)%360} 68% ${58-i*7}%)" opacity="${0.5-i*0.1}"/>`).join("");
  return `${box}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${hue} 62% 46%)"/><stop offset="1" stop-color="hsl(${hue2} 58% 28%)"/>
      </linearGradient></defs><rect width="100" height="100" fill="url(#g${h})"/>
      <g transform="rotate(${rot} 50 50)">${rings}</g></svg>
    ${badge?`<span class="badge">${esc(badge)}</span>`:""}</div>`;
}

  // 所以数据还没到就先记下这条链接，一刷新再落（同项目页那套 pendingHash）。

}
au.addEventListener("loadedmetadata", () => {
  if (unlocking()) return;
  probeSeekable();
  if (pendingSeek != null && state.seekable) { try { au.currentTime = pendingSeek; } catch {} pendingSeek = null; }
  if (!state.seekable) startFallback();   // 跳不动的源：整首在后台下，进度条先禁用
  updateBuf(); tick();
});
au.addEventListener("durationchange", () => { if (!unlocking()) { probeSeekable(); tick(); } });
au.addEventListener("progress", () => { if (!unlocking()) { probeSeekable(); updateBuf(); } });
au.addEventListener("play",  () => { if (unlocking()) return; state.playing = true; renderBar(); if (!raf) raf = requestAnimationFrame(loop); });
au.addEventListener("playing", () => { if (unlocking()) return; state.loading = false; state.stalled = false; syncBarState(); });
au.addEventListener("waiting", () => { if (unlocking() || au.paused) return; state.stalled = true; syncBarState(); });
au.addEventListener("seeking", () => { if (unlocking()) return; state.stalled = true; syncBarState(); });
au.addEventListener("seeked",  () => { if (unlocking()) return; state.stalled = !au.paused && au.readyState < 3; updateBuf(); syncBarState(); });
au.addEventListener("canplay", () => { if (unlocking()) return; state.stalled = false; syncBarState(); });
au.addEventListener("pause", () => { if (unlocking()) return; state.playing = false; state.loading = false; state.stalled = false; renderBar(); });
au.addEventListener("timeupdate", tick);
/* 播完之后：单曲循环就再来一遍；队列里还有别人就接着放；
   就这一首（一个项目只有一版是常态）就归零停下 —— 再点从头，和 2026-09-16 的行为一样。
   「列表循环」循的是列表，不是把独一首歌变成没完没了。 */
au.addEventListener("ended", () => {
  if (unlocking()) return;
  state.activeLine = null;
  if (state.mode === "one") { seekTo(0); au.play().catch(() => { state.playing = false; renderBar(); }); return; }
  if (state.queue.length > 1 && advance(1)) return;
  state.playing = false; seekTo(0); renderBar();
});
au.addEventListener("error", () => { if (unlocking() || !state.cur || !au.getAttribute("src")) return;
  if (state.blobReady && au.getAttribute("src") !== state.blobReady) { swapToFull(state.blobReady); return; }   // 流式源坏了、整份在手：换上
  state.loading = false; state.playing = false; state.stalled = false; renderBar(); toast(T("playFailed")); });

function curDur(){
  if (isFinite(au.duration) && au.duration > 0) return au.duration;
  return state.cur ? (state.cur.ms ? state.cur.ms/1000 : parseDur(state.cur.dur)) : null;
}
function tick(){
  if (!state.cur) return;
  // 还没落位的 seek（元数据没到 / 在等兜底的整份换上）：进度停在他拖到的地方，别被真实播放位置拽回去
  const d = curDur(),
        t = pendingSeek != null ? pendingSeek : au.currentTime;
  if (!seekDrag) {
    const p = d ? Math.min(100, t/d*100) : 0;
    const fill = $("seekFill"), knob = $("seekKnob");
    if (fill) { fill.style.width = p+"%"; knob.style.left = p+"%"; }
    const e = $("tNow"); if (e) e.textContent = mmss(t);
    const m = $("tMobile"); if (m) m.textContent = mmss(t);
  }
  const r = $("tEnd"); if (r) r.textContent = mmss(d);
  markLive(t);
}
function loop(){ tick(); raf = state.playing ? requestAnimationFrame(loop) : null; }
/* 正在唱到哪一句。位置来自谱上那条唱出来的线（serve.py 的 align），实测多数落在一秒内，
   所以只轻轻托个底色 —— 担得起「大概在这儿」，担不起逐字。

   两个数都是有来由的，别随手调：
   · LIVE_LEAD  提前一点亮，人眼要先看到那一句才跟得上；比精修页点句子的预卷（0.3s）长一点，
     这样点哪句、哪句立刻就是亮的。
   · HOLD_MAX   一句唱完、下一句还没来时最多再托这么久。间奏里不该有高亮（那时没人在唱），
     但句与句之间的换气只有半秒多，一空就灭会闪。 */
const LIVE_LEAD = 0.35, HOLD_MAX = 2.5;
let liveIx = [], liveIxKey = false;
function liveIndex(){
  const c = state.cur, key = c ? c.src : null;
  if (key === liveIxKey) return liveIx;
  liveIxKey = key; liveIx = [];
  ((c && c.align) || []).forEach((a, si) => (a.lineT || []).forEach((t0, li) => {
    if (t0 == null) return;
    liveIx.push({id: si+":"+li, t0, t1: (a.lineT1 && a.lineT1[li] != null) ? a.lineT1[li] : t0});
  }));
  liveIx.sort((x, y) => x.t0 - y.t0);
  return liveIx;
}
function markLive(t){
  const ix = liveIndex();
  const x = t + LIVE_LEAD;
  let id = null;
  for (let i = ix.length - 1; i >= 0; i--) {
    if (ix[i].t0 > x) continue;
    const nxt = i + 1 < ix.length ? ix[i+1].t0 : Infinity;
    if (x <= Math.min(nxt, ix[i].t1 + HOLD_MAX)) id = ix[i].id;
    break;
  }
  if (id === state.activeLine) return;
  state.activeLine = id;
  document.querySelectorAll(".lrow.live,.sec-p div.live").forEach(el => el.classList.remove("live"));
  if (!id) return;
  document.querySelectorAll(`[data-line="${id}"],[data-ln="${id}"]`).forEach(el => { el.classList.add("live"); followLive(el); });
}
/* 跟唱：正在唱的那句离开中间区域就把它滚回视野中央（词面板 / 精修页各自的滚动容器）。
   人自己滚过就让开 4 秒再接上；精修页在写建议（悬浮窗开着）时不动。 */
const followPause = {panel: 0, scroller: 0};
["wheel", "touchmove", "pointerdown"].forEach(ev => document.addEventListener(ev, (e) => {
  const key = e.target.closest("#panel") ? "panel" : e.target.closest("#scroller") ? "scroller" : null;
  if (key) followPause[key] = Date.now() + 4000;
}, {passive: true}));
function followLive(el){
  const inPanel = !!el.closest("#panel");
  const box = inPanel ? el.closest(".panel-body") : $("scroller");   // 标题在滚动区外面，滚的是 .panel-body
  if (!box || Date.now() < followPause[inPanel ? "panel" : "scroller"]) return;
  if (!inPanel && (state.line != null || !$("pop").hidden)) return;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  const inset = inPanel ? 0 : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dockh")) || 0);
  const top = b.top + (inPanel ? 0 : 60), bottom = b.bottom - inset;     // 面板标题不再盖住滚动区顶部，不用让位
  const band = bottom - top;
  if (r.top >= top + band * 0.2 && r.bottom <= bottom - band * 0.3) return;   // 还在中间区域，不动
  box.scrollTo({top: box.scrollTop + (r.top - top) - band / 2 + r.height / 2, behavior: "smooth"});
}
function setDockVar(){
  requestAnimationFrame(() => {
    const h = document.querySelector(".dock").getBoundingClientRect().height;
    document.documentElement.style.setProperty("--dockh", Math.round(h) + "px");
  });
}

/* ── 播放队列（design.md §4.4）──
   一条规则：队列 = 你触发播放的那一刻，那一屏里能播的东西，按你看到的顺序。
   四个入口各自把「自己这一屏」交出来，不是四个页面各写一套。 */

/* 同一首歌的不同版本 → 同一个 key，切过去时进度不动（§4.1 的同位 A/B —— 现在是一条规则，
   不再是播放条上那枚 V 药丸）。分享必须带上是谁分享的：两个人各有一个同名项目，不是同一首歌。 */
function songKey(o){
  if (!o) return "";
  return o.pkey ? "p:" + o.pkey : "s:" + (o.by || "") + ":" + (o.project || o.title);
}
function setQueue(items, i){
  state.queue = items || []; state.qi = i == null ? -1 : i;
  reshuffle();
}
function reshuffle(){
  const n = state.queue.length;
  state.shuf = Array.from({length: n}, (_, k) => k);
  for (let k = n - 1; k > 0; k--) { const j = (Math.random()*(k+1))|0;
    [state.shuf[k], state.shuf[j]] = [state.shuf[j], state.shuf[k]]; }
}
/* 走到队列里的第 i 项 —— 这是队列唯一的落点，上/下一首、点队列里的一行、数字键都走它 */
function playAt(i, opt){
  const o = state.queue[i]; if (!o) return false;
  opt = opt || {};
  const c = state.cur, same = c && o.src !== c.src && songKey(o) === songKey(c);
  state.qi = i;
  let at = null, autoplay = true;
  if (same) {
    const d = o.ms ? o.ms/1000 : parseDur(o.dur);
    at = (!d || au.currentTime < d - 0.5) ? au.currentTime : null;   // 那一版更短就从头，别落到片尾之外
    autoplay = state.playing || state.loading;                        // 停着切版本就还停着
  }
  if (opt.autoplay === false) autoplay = false;
  playSrc(o, {at, autoplay});
  return true;
}
/* 上一首 / 下一首。三种模式里都没有「播到头就停」—— 到头就回头；
   单曲循环只管自动续播那一下，手动点下一首照走。 */
function advance(delta){
  const n = state.queue.length;
  if (!n) return false;
  if (state.qi < 0) return playAt(0);
  if (n === 1) { seekTo(0); if (au.paused) au.play().catch(()=>{}); return true; }
  if (state.mode === "shuffle") {
    let at = state.shuf.indexOf(state.qi); if (at < 0) at = 0;
    let x = at + delta;
    if (x < 0 || x >= n) { reshuffle(); x = (x + n) % n; }            // 走完一轮重新洗
    return playAt(state.shuf[x]);
  }
  return playAt((state.qi + delta + n) % n);
}
/* 上一首的通用手感：已经播过 3 秒，先回本曲开头；再点才真的上一首 */
function goPrev(){
  if (state.cur && au.currentTime > 3) { seekTo(0); return; }
  advance(-1);
}
const MODE_LABEL = {loop:T("modeLoop"), shuffle:T("modeShuffle"), one:T("modeOne")};
function cycleMode(){
  state.mode = state.mode === "loop" ? "shuffle" : state.mode === "shuffle" ? "one" : "loop";
  if (state.mode === "shuffle") reshuffle();
  renderBar(); renderQueue();
  toast(MODE_LABEL[state.mode]);
}

/* 队列从哪来：项目（含精修页）= 这个项目的全部版本，顺序就是列表里的顺序 */
function queueOfProject(p){ return (p.takes||[]).map((t, i) => takeObj(p, t, i)); }
/* 发现页 = 当时列出来的那些：「我的分享」在前（收起时只露 3 条），然后是大家的 */
/* 发现页主体 = **所有人分享的，按分享时间新→旧**（服务端 shared.json 就是这个序）。
   两次改判都记在这儿，因为两次说的其实是同一件事的两面：
   · 先是「只列别人的」—— 冲着"一进发现就满屏自己的歌，那就不叫发现了"；
   · 再是「我的也要在里面」（PM 2026-09-17）—— **把自己的抽掉，时间线就断了**：
     我刚分享的那首不在池子里，等于看不到自己在这条时间线上的位置。
   真正解决第一个顾虑的是**入口 + 两个二级页**那一步，不是从主体里剔人。
   `order` 是队列：**当前这一屏能播的那些**，所以二级页里播放就在那一页的清单里走（§4.4）。 */
function discoverRows(){
  const ss = DATA.shared || [], me = ME(), all = [], mine = [], likes = [];
  ss.forEach((sh, i) => {
    all.push([sh, i]);
    if (sh.by === me) mine.push([sh, i]);
    if (sh.liked) likes.push([sh, i]);
  });
  // 「我喜欢的」按点心的先后倒序 —— 它是自己攒的一条清单，刚收下的在最上面
  likes.sort((a, b) => (b[0].likedAt || 0) - (a[0].likedAt || 0));
  /* 发现页：用你读的那种语言唱的排前面（2026-09-22）。
     这一页是很多人对这个产品的第一印象，而一个韩语用户第一次打开就看到整屏中文歌，
     读到的是「这是个中文产品」—— 哪怕界面已经是韩语的。
     **只排序，不过滤**：别的语言照常在下面，因为按语言筛会让冷启动变成一片空白，
     那比看见外语歌更糟。排序是稳定的，所以组内原顺序（服务端排的）一动不动 ——
     中文用户看到的几乎不变，现在分享出来的差不多都是中文歌。
     繁体读者按 `lang.zh` 算：字不同，歌是同一种语言。 */
  const myLang = "lang." + (L === "zh-Hant" ? "zh" : L);
  const readsMine = ([sh]) => (sh.tags || []).includes(myLang);
  all.sort((a, b) => (readsMine(b) ? 1 : 0) - (readsMine(a) ? 1 : 0));
  const page = state.minePage === "shared" ? mine : state.minePage === "liked" ? likes : all;
  // 标签筛选只砍**清单**，不砍上面那两枚入口的计数 —— 它们说的是「我一共分享了几条」，
  // 筛着的时候变成「筛剩几条」会让人以为自己的歌少了。
  const list = state.tags.length ? page.filter(([sh]) => tagMatch(sh)) : page;
  return {all, mine, likes, page, list, order: list};
}

/* 版本按先后排 —— 桌面数字键 1–9 还按版本号认人（语义不变，只是落点改成队列） */
function versionList(c){
  const p = c && c.refine != null ? DATA.projects[c.refine.p] : null;
  if (!p) return [];
  return (p.takes||[]).map((t, i) => ({t, i, v: vOf(t, i)})).sort((a, b) => a.v - b.v);
}
function switchTake(i){
  const c = state.cur; if (!c || !c.refine || i === c.refine.t) return;
  const qi = state.queue.findIndex(o => o.refine && o.refine.p === c.refine.p && o.refine.t === i);
  if (qi >= 0) { playAt(qi); return; }
  // 队列是别处的（在发现页听着这首歌的某一版）：就地同位切，不动队列
  const p = DATA.projects[c.refine.p], k = (p.takes||[])[i];
  if (!k) return;
  playSrc(takeObj(p, k, i), {at: au.currentTime, autoplay: state.playing || state.loading});
}

/* 列表里每一行的小指示器跟着播放条走（播放 / 暂停 / 切版本 / 取回中），不整页重画 */
function syncRows(){
  document.querySelectorAll(".song[data-src]").forEach(row => {
    const cur = !!(state.cur && state.cur.src === row.dataset.src);
    const playing = cur && state.playing, loading = cur && state.loading;
    row.classList.toggle("now", cur);
    const ind = row.querySelector(".mini.ind"); if (!ind) return;
    ind.className = "mini ind " + (playing ? "on" : cur ? "cur" : "");
    ind.innerHTML = loading ? SPIN_S : playing ? EQ : PLAY_S;
  });
}
/* 进度条什么时候能拖：源可以跳，或者兜底的整份已经在本地。其余时候禁用 —— 拖了没反应比
   拖不动更糟（PM 2026-09-21：「会给用户失效的感觉，建议能拖动前 disable」）。 */
const seekEnabled = () => !!(state.cur && (state.seekable || state.blobReady));
/* 播放条上会频繁翻转的几个态（转圈 / 进度条禁用 / 跳动中），只改属性不重画整条 ——
   重画会把 hover、拖动中的把手一起打掉，而 progress / waiting 一秒能来好几次。 */
function syncBarState(){
  const busy = state.loading || (state.stalled && state.playing);
  const b = $("playBtn");
  if (b) {
    b.innerHTML = busy ? `<span class="spin"></span>` : state.playing ? PAUSE_L : PLAY_L;
    b.setAttribute("aria-label", state.playing ? T("pause") : T("play"));
    b.title = T("playHint", {verb: state.playing ? T("pause") : T("play")});
  }
  const sk = $("seek");
  if (sk) { sk.classList.toggle("off", !seekEnabled()); sk.classList.toggle("busy", busy && !state.loading);
            sk.setAttribute("aria-disabled", seekEnabled() ? "false" : "true"); }
  syncRows();
}
/* 封面 + 歌名那一块 = 「正在听的这首在哪儿」的入口（PM 2026-09-21）：分享来的去它的单曲页
   （`#/s/<sid>` 正是转发出去的那条地址），自己项目里的那一版回它的项目页（项目页就是版本列表）。
   两样都落不了地就返回空串 —— 那时它仍是一块死信息，不画 hover 也不可聚焦，免得点下去没反应。
   项目那一路**押 slug 不押下标**：她一落盘新项目，队列里记着的那个下标就指到别人头上了（takeObj 同因）。 */
function barNavTarget(c, projects){
  if (!c) return "";
  if (c.sid) return `data-song="${esc(c.sid)}"`;
  const pi = c.pkey ? (projects || []).findIndex(p => slugOf(p) === c.pkey)
           : (c.refine ? c.refine.p : -1);
  return pi >= 0 ? `data-proj="${pi}"` : "";
}
function renderBar(){
  const b = $("bar");
  syncRows();
  if (!state.cur) { b.className = "bar"; b.innerHTML = ""; setDockVar(); return; }
  const c = state.cur, d = curDur(), was = b.classList.contains("on");
  b.className = "bar on" + (was ? "" : " rise");
  const multi = state.queue.length > 1;
  const nav = barNavTarget(c, DATA.projects);
  b.innerHTML = `<div class="bar-nav${nav ? " on" : ""}" ${nav}${nav ? ` role="button" tabindex="0" title="${esc(T("openThisSong"))}"` : ""}>
      ${art(c.project||c.title, "44px", c.badge)}
      <div class="bar-m"><div class="bar-t">${esc(c.title)}</div>
        <div class="bar-s">${esc(c.sub||"")}</div></div></div>
    <div class="trans">
      ${multi ? `<button class="step" data-step="-1" aria-label="${esc(T("prevSong"))}" title="${esc(T("prevSongHint"))}">${PREV_L}</button>` : ""}
      <button class="play" id="playBtn" aria-label="${state.playing?T("pause"):T("play")}"></button>
      ${multi ? `<button class="step" data-step="1" aria-label="${esc(T("nextSong"))}" title="${esc(T("nextSongHint"))}">${NEXT_L}</button>` : ""}
    </div>
    <div class="seekwrap">
      <span class="tnum" id="tNow">${mmss(au.currentTime)}</span>
      <div class="seek${seekEnabled()?"":" off"}" id="seek"><div class="rail"></div><div class="buf" id="seekBuf" style="width:${state.buf*100}%"></div>
        <div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div>
      <span class="tnum r" id="tEnd">${mmss(d)}</span>
    </div>
    <span class="mobile-time" id="tMobile">${mmss(au.currentTime)}</span>
    <button class="lyrbtn ico mode" data-mode="1" aria-pressed="${state.mode!=="loop"}"
      aria-label="${MODE_LABEL[state.mode]}" title="${MODE_LABEL[state.mode]}">${ICON[state.mode]}</button>
    <button class="lyrbtn ico" data-queue="1" aria-pressed="${state.qOpen}"
      aria-label="${state.qOpen?T("queueClose"):T("queueOpen")}" title="${esc(T("queueTitle"))}">${ICON.queue}</button>
    ${c.lyrics ? `<button class="lyrbtn" data-lyr="1" aria-expanded="${state.lyrOpen}"
      aria-label="${state.lyrOpen?T("lyricsClose"):T("lyricsOpen")}"><span>${T("lyricsShort")}</span>${ICON.chev}</button>` : ""}`;
  $("playBtn").onclick = togglePlay;
  const sk = $("seek");
  const at = (ev) => { const r = sk.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); };
  const show = (ev) => { const d2 = curDur(); if (!d2) return null; const p = at(ev);
    $("seekFill").style.width = p*100+"%"; $("seekKnob").style.left = p*100+"%";
    const t = p*d2; $("tNow").textContent = mmss(t); const m = $("tMobile"); if (m) m.textContent = mmss(t);
    return t; };
  sk.onpointerdown = (ev) => { if (!seekEnabled()) return; seekDrag = true; sk.classList.add("drag"); sk.setPointerCapture(ev.pointerId); show(ev); };
  sk.onpointermove = (ev) => { if (seekDrag) show(ev); };
  sk.onpointerup = sk.onpointercancel = (ev) => { if (!seekDrag) return;
    const t = show(ev); seekDrag = false; sk.classList.remove("drag");
    if (t != null) seekTo(t); };
  syncBarState();
  tick();
  renderPanel();
  renderQueue();
  setDockVar();
}

/* 播放条上的歌词层：有对齐就一句一行、正在唱的托底色；没有就整段摊开。
   它和精修页互斥（PM 2026-09-16）：精修页本身就是这一版的词，两个一起开是重复。 */
let panelKey = null;
function renderPanel(){
  const c = state.cur, ly = c && c.lyrics;
  const key = ly && state.lyrOpen ? c.src : "";
  if (key === panelKey) return;      // 播放时每帧都在 tick，别把面板连滚动位置一起重画
  panelKey = key; state.activeLine = null;
  const el = $("panel");
  if (!key) { el.className = "panel"; el.innerHTML = ""; return; }
  el.className = "panel on";
  el.innerHTML = `<div class="panel-in">
    <div class="panel-h"><span class="panel-t">${esc(c.title)}${c.badge ? " · " + esc(c.badge) : ""} · ${T("panelLyrics")}</span>
      ${c.align ? timingTag(c) : ""}</div>
    <div class="panel-body">${c.align ? alignHtml(c.align) : sectionsHtml(ly.sections)}</div></div>`;
}

/* ── 顶栏 ── */
const TABS = [{id:"mine",label:T("tabMine")}];
function takeSub(p, t){
  const j = parentOf(p, t), from = j >= 0 ? T("fromVersion", {n: vOf(p.takes[j], j)}) : "";
  // 旋律是他自己的（哼的 / 画的）：写在这一版的副标题上 —— 参与感的回执（design.md §10）。
  // 说到哪一层要跟着 melody_mode 走：`whole` 整首是他那段（短歌那条路），`graft` 只有副歌 ——
  // 后者说「旋律是你画的」就是在说谎，而这句话除了可信没有别的用处（design.md §10.4）。
  const WHERE = {chorus:"secChorus", verse:"secVerse"};
  const made = t.melody === "draw" ? T("melodyDrawn") : t.melody === "hum" ? T("melodyHummed") : "";
  const mel = !made ? "" :
    (t.melody_mode === "graft" ? T(WHERE[t.melody_section] || "melodyYours") : T("melodyYours")) + made;
  if (t.asked) return [from, mel, t.asked].filter(Boolean).join(" · ");
  if (from || mel) return [from, mel].filter(Boolean).join(" · ");
  if (t.created > 1e9) return shortDate(new Date(t.created * 1000));
  return t.meta && !/^seed\b/.test(t.meta) ? t.meta : "";
}
function takeObj(p, k, i){
  return {title:p.title, sub:takeSub(p, k), src:k.audio, dur:k.dur, ms:k.ms, bytes:k.bytes, project:p.title,
          pkey:slugOf(p),                                                    // songKey 押 slug 不押下标：数据一刷新下标会漂
          badge:"V"+vOf(k, i), label:k.note || T("versionN", {n: vOf(k, i)}),   // 队列里一行就叫它在列表里的名字
          lyrics:k.lyrics||p.lyrics, align:k.align, timing:k.timing,
          canRefine:k.canRefine, refining:k.refining,
          refine:{p:DATA.projects.indexOf(p), t:i}};
}
/* 队列面板：和词面板共用播放条上方那一格，互斥 —— 两层抽屉叠起来没人认得出哪是哪。
   一行 = 项目页的一行（design.md §4.4）：同样的封面、同样的「在响」、同样的 ⋯，
   所以播放条上撤掉的那枚「精修」不是没了，是回到了它本来属于的地方。 */
let queueKey = null;
function renderQueue(){
  const el = $("queue"); if (!el) return;
  const on = state.qOpen && state.queue.length > 0;
  const key = on ? state.queue.length + "|" + (state.queue[0]||{}).src + "|" + state.qi + "|" + state.mode : "";
  if (key === queueKey) return;                  // 播放时每帧都 tick，别把面板连滚动位置一起重画
  queueKey = key;
  if (!on) { el.className = "panel"; el.innerHTML = ""; return; }
  el.className = "panel on";
  el.innerHTML = `<div class="panel-in">
    <div class="panel-h"><span class="panel-t">${T("queueHead", {n: state.queue.length})}</span>
      <span class="panel-a"><button class="modes" data-mode="1" aria-label="${MODE_LABEL[state.mode]}"
        >${ICON[state.mode]}<span>${MODE_LABEL[state.mode]}</span></button></span></div>
    <div class="panel-body"><div class="list">${state.queue.map(queueRow).join("")}</div></div></div>`;
  requestAnimationFrame(() => { const now = el.querySelector(".song.now"); if (now) now.scrollIntoView({block:"nearest"}); });
}
function queueRow(o, i){
  const cur = state.cur && state.cur.src === o.src;
  const playing = cur && state.playing, loading = cur && state.loading;
  return `<div class="song q ${cur?"now":""}" role="button" tabindex="0" data-q="${i}" data-src="${esc(o.src)}">
    ${art(o.project||o.title, "40px", o.badge)}
    <div class="song-mid"><div class="song-t"><span>${esc(o.label || o.title)}</span></div>
      ${o.sub ? `<div class="song-s">${esc(o.sub)}</div>` : ""}</div>
    <div class="song-r"><span class="dur">${esc(o.dur||"")}</span>
      <span class="mini ind ${playing?"on":cur?"cur":""}">${loading ? SPIN_S : playing ? EQ : PLAY_S}</span>
      ${o.refine ? `<span class="mini" data-qmore="${i}" data-stop="1" role="button" title="${esc(T("more"))}">${ICON.more}</span>` : ""}
    </div></div>`;
}
/* 两个抽屉互斥：开一个就把另一个收起来 */
function openDrawer(which){
  if (which === "queue") { state.qOpen = !state.qOpen; if (state.qOpen) state.lyrOpen = false; }
  else { const open = !state.lyrOpen; if (open) { state.qOpen = false; if (state.refine) leaveRefine(); }
    state.lyrOpen = open; }
  renderBar(); syncRows();
}
/* 抽屉两条自动收起的路（PM 2026-09-21）：换了界面（render 里按 lastRoute 判）、点了空白处（这里）。
   「空白」= 从点到的地方往上数到 body，没有一个是看着能点的东西 —— 这页所有可点面共有的记号是
   cursor:pointer（按钮 / 行 / 卡 / chip / 词句 / 进度条），表单控件和链接另算。
   点在能点的东西上不收：点另一版是「换歌」，面板要跟着换词，不是「走开」。停靠区和悬浮窗里的点击不在此列。 */
function isBlank(el){
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    if (n.matches("input,textarea,select,a,button,summary,[role=button],[contenteditable]")) return false;
    if (getComputedStyle(n).cursor === "pointer") return false;
  }
  return true;
}
function closeDrawers(){
  if (!state.lyrOpen && !state.qOpen) return;
  state.lyrOpen = false; state.qOpen = false;
  renderBar(); syncRows();
}

/* `#/p/<slug>/v<N>` 的落点：停在项目页，把那一版装进播放条、滚到它那一行。
   **刻意不自动播**：这条路由是 launcher 的 cold 重开落点（`lastUrl`），每次冷启动都要走一遍，
   自动出声就变成「每次打开 app 都开始放歌」。门只负责把你带到那一版跟前，按不按播放是你的事。 */
function landOnTake(ti){
  const p = DATA.projects[state.project]; if (!p) return;
  const k = (p.takes || [])[ti]; if (!k) return;
  if (!state.cur || state.cur.src !== k.audio) playTake(k, {autoplay: false});
  const row = document.querySelector(`.song[data-play="${ti}"]`);
  if (row) row.scrollIntoView({block: "center", behavior: "smooth"});
}

function playTake(k, opt){
  const p = DATA.projects[state.refine ? state.refine.p : state.project];
  const i = (p.takes||[]).indexOf(k);
  setQueue(queueOfProject(p), i);            // 队列 = 这个项目的全部版本（§4.4）
  playSrc(state.queue[i] || takeObj(p, k, i), opt);
}
function enterRefine(pi, ti){
  state.refine = {p:pi, t:ti}; state.project = pi; state.tab = "mine"; state.page = null;
  state.song = null;                      // 从单曲页的队列面板 ⋯ 进来的话，不清就被单曲页吞掉（同 openPage）
  // 精修的默认前提是「这一首基本对了，只是有瑕疵」——所以旋律默认保住；
  // 真想换旋律的，那是重做，不是精修。
  state.line = null; state.activeLine = null;
  const p0 = DATA.projects[pi], k0 = (p0.takes||[])[ti];
  const key = k0 && (k0.id || k0.audio);
  if (!state.pending || state.pending.key !== key) {   // 换了一版才清，回头接着写
    state.notes = {};
    state.keepScore = !!(k0 && (k0.segments||[]).length);
  }
  state.pending = k0 ? {p:pi, t:ti, key, title:p0.title, v:vOf(k0, ti), score:k0.score} : null;
}
function openRefine(pi, ti){
  state.lyrOpen = false;                 // 精修和词互斥：进精修就收起词面板
  enterRefine(pi, ti); go();
  const [, k] = refineTake();
  if (k && (!state.cur || state.cur.src !== k.audio)) playTake(k);   // 精修就是边听边说
}
function leaveRefine(){ closePop(true); state.refine = null; state.line = null; go(); }
function isRefining(pi, ti){ return !!(state.refine && state.refine.p === pi && state.refine.t === ti); }
/* 进这一版的二级页（词 / 分享）。**`state.song` 必须清**：它在 `routeOf` 和 `render` 里都排在
   最前面，不清的话整次点击会被单曲页吞掉 —— 状态全改对了，屏幕上一动不动，读起来就是
   「这个按钮点不了」（PM 2026-09-21 报的「改分享」正是它）。**`state.tab` 同理**：它原先只从
   「我的歌」页调得到，tab 早就是 mine 了；从单曲页进来时不设，人会落回发现页那边。
   自从单曲页有了「改分享」、队列面板的 ⋯ 在哪一页都开得出来，「调用方那边已经对了」这个前提
   就不再成立 —— 去向要这个函数自己交代全。同一条判据参见 `data-proj` / `data-minepage`
   两条委托和 `enterRefine`。 */
function openPage(kind, ti, from){ closePop(true); state.tab = "mine"; state.refine = null; state.song = null;
  state.page = {kind, t: ti, from}; state.shareDone = false; go(); }

/* ── 顶栏记号（动效版，2026-09-21；样式在 .mark 一族，判据 design.md §9）──
   renderTop 用 brandMark()；首页 hero 那枚 60px 的 logo() 不动。
   放歌与否听 <audio> 自己（真出声 playing → 起舞；缓冲见底 waiting / 暂停 / 放完 / 换源 → 停），
   不读 state.playing：解锁那一声静音（UNLOCK_WAV）也会触发 play 事件，得认出来跳过。 */
function star4(cx, cy, r){                       // 四角星，内点比 .36 —— 和主记号同一族
  const i = r * .36;
  return `M${cx} ${cy-r}L${cx+i} ${cy-i}L${cx+r} ${cy}L${cx+i} ${cy+i}L${cx} ${cy+r}L${cx-i} ${cy+i}L${cx-r} ${cy}L${cx-i} ${cy-i}Z`;
}
function brandMark(){
  return `<span class="mark" aria-hidden="true"><i class="halo"></i><i class="rays"></i><i class="rays2"></i>
    <svg class="logo" viewBox="0 0 24 24">
      <defs><linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f0834f"/><stop offset="1" stop-color="#d1425f"/></linearGradient></defs>
      <g class="spin"><g class="star"><path d="M12 1.6l2.1 6.1 6.3 2.2-6.3 2.2L12 18.2l-2.1-6.1L3.6 9.9l6.3-2.2z" fill="url(#lgm)"/></g></g>
      <g class="note"><circle cx="18.4" cy="17.8" r="2.5" fill="none" stroke="url(#lgm)" stroke-width="1.5"/>
        <path d="M20.9 17.8v-5l2.1.7" fill="none" stroke="url(#lgm)" stroke-width="1.5" stroke-linecap="round"/></g>
      <path class="sp sp1" d="${star4(4.2, 3.6, 1.7)}" fill="#ffb27a"/>
      <path class="sp sp2" d="${star4(20.8, 4.4, 1.3)}" fill="#f0834f"/>
    </svg></span>`;
}
function syncBrandBeat(ev){
  const unlock = au.getAttribute("src") === UNLOCK_WAV;
  const on = ev.type === "playing" && !unlock;
  document.body.classList.toggle("playing", on);
}
["playing","waiting","pause","ended","emptied","error"].forEach(ev => au.addEventListener(ev, syncBrandBeat));

function renderTop(){
  $("top").innerHTML = `<button class="brand" data-tab="mine">${brandMark()}<b>${esc(DATA.title)}</b></button>
    <div class="tabs">${TABS.map(t =>
      `<button class="tab" role="tab" aria-selected="${t.id===state.tab}" data-tab="${t.id}">${t.label}</button>`).join("")}</div>`;

/* ── ① 首页 ── */
function renderHome(){

      <button class="navc" data-tab="discover"><span class="ic">${ICON.discover}</span>
