<!doctype html>
<html lang="__HTMLLANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root{
  --bg:#0f1012; --bg-2:#16171a; --card:#1b1d21; --card-2:#212429; --sunk:#0a0b0c;
  --ink:#f2f0ed; --ink-2:#a8a6a2; --ink-3:#6e6c69;
  --line:#26282d; --line-2:#1f2126;
  --hot:#e8663c; --hot-soft:#2a1a14; --hot-tint:rgba(232,102,60,.18);
  --r:14px; --r-lg:18px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --num:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f5f3; --bg-2:#fff; --card:#fff; --card-2:#faf9f7; --sunk:#eceae6;
  --ink:#1a1917; --ink-2:#5f5d59; --ink-3:#98958f;
  --line:#e6e3de; --line-2:#efedea;
  --hot:#cf5227; --hot-soft:#fdf0ea; --hot-tint:rgba(207,82,39,.12);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:26px 18px 64px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);
  font-weight:700;font-family:var(--num)}
h1{margin:6px 0 0;font-size:26px;letter-spacing:-.01em}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);
  border-radius:999px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.16s}
.ghost:hover{border-color:var(--hot);color:var(--hot)}
.stamp{margin:10px 0 22px;font-size:12px;color:var(--ink-3);font-family:var(--num)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px}
.card+.card,.grid+.card{margin-top:14px}
/* grid 里两张卡是**并排的兄弟**，会被上面那条 .card+.card 推下去 14px —— 顶边就错开了。
   并排的间距由 grid 的 gap 管，不该再叠一层 margin（PM 2026-09-17 看图发现） */
.grid>.card{margin-top:0}
.label{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.big{font-size:42px;line-height:1.1;font-family:var(--num);font-weight:600;margin:8px 0 2px;
  font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--ink-3);margin-left:6px;font-family:var(--sans);font-weight:400}
.sub{font-size:13px;color:var(--ink-2)}
/* 设置行：左边说这是什么、右边一枚开关。开关本身是纯 CSS 的，
   `aria-checked` 既是状态也是样式的开关 —— 读屏和眼睛看到的是同一个东西。 */
.set{display:flex;align-items:flex-start;gap:16px;margin-top:12px}
.set-m{flex:1;min-width:0}
.set-t{font-size:14px;font-weight:600;margin-bottom:5px}
.set-s{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.set-s b{color:var(--ink-2);font-weight:500}
.sw{flex:0 0 auto;width:44px;height:26px;padding:0;border:0;border-radius:999px;cursor:pointer;
  background:var(--sunk);position:relative;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--ink-3);transition:.18s}
.sw[aria-checked="true"]{background:var(--hot)}
.sw[aria-checked="true"]::after{left:21px;background:#fff}
.sw:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;
  border-top:1px solid var(--line-2);padding-top:16px}
.stats div{display:flex;flex-direction:column;gap:3px}
.stats b{font-size:19px;font-family:var(--num);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--ink-3)}
.people{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;
  border-top:1px solid var(--line-2);padding-top:14px}
.person{display:flex;align-items:center;gap:6px;background:var(--card-2);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;max-width:100%}
.person.me{border-color:var(--hot);background:var(--hot-soft)}
.person img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.person i{font-style:normal;font-size:12px;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:130px}
.person.me i{color:var(--hot)}
.person.more{background:transparent;border-style:dashed;padding:3px 10px}
.person.more i{color:var(--ink-3)}
.chart{display:flex;gap:5px;margin-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.barwrap{height:132px;width:100%;display:flex;align-items:flex-end}
/* 没出歌的日子也留一条底座 —— 原先用 --sunk，在深色下比卡片还深，那一段看着像图表坏了 */
.bar{width:100%;display:flex;flex-direction:column-reverse;border-radius:5px;
  overflow:hidden;background:var(--line);min-height:3px;
  transform-origin:bottom;animation:grow .42s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
.seg{width:100%}
.seg.own{background:var(--hot)}
.seg.gst{background:var(--ink-3);opacity:.5}
.day{font-size:9px;color:var(--ink-3);margin-top:7px;font-family:var(--num)}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.own{background:var(--hot)}
.dot.gst{background:var(--ink-3);opacity:.5}
.note{margin-top:20px;font-size:12px;color:var(--ink-3);line-height:1.8}
</style>
</head>
<body data-doc-title="adminTitle">
<div class="wrap">
  <div class="hd">
    <div>
      <div class="eyebrow"><span data-i18n="adminTitle"></span></div>
      <h1><span data-i18n="adminH1"></span></h1>
    </div>
    <div>
      <a class="ghost" href="/#/" data-i18n="privateAdminBack"></a>
      <button class="ghost" id="reload"><span data-i18n="adminReload"></span></button>
    </div>
  </div>
  <div class="stamp" id="stamp"><span data-i18n="adminLoading"></span></div>

  <div class="grid">
    <section class="card">
      <div class="label" data-i18n="privateAudienceTitle"></div>
      <div class="big" id="friends">—<small></small></div>
      <div class="sub" id="friends-sub">—</div>
      <div class="people" id="people"></div>
    </section>

    <section class="card">
      <div class="label" data-i18n="adminTotal"></div>
      <div class="big" id="total">—<small></small></div>
      <div class="sub" id="split">—</div>
      <div class="stats">
        <div><b id="today">—</b><span data-i18n="adminToday"></span></div>
        <div><b id="d7">—</b><span data-i18n="adminD7"></span></div>
        <div><b id="d30">—</b><span data-i18n="adminD30"></span></div>
        <div><b id="proj">—</b><span data-i18n="adminProjects"></span></div>
      </div>
    </section>
  </div>

  <section class="card">
    <div class="label" data-i18n="adminChartHead"></div>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><i class="dot own"></i><b data-i18n="adminYours"></b></span>
      <span><i class="dot gst"></i><b data-i18n="adminGuestsLabel"></b></span>
    </div>
  </section>

  <section class="card">
    <div class="label" data-i18n="adminSettings"></div>
    <div class="set">
      <div class="set-m">
        <div class="set-t" data-i18n="adminCommentsTitle"></div>
        <div class="set-s" data-i18n-html="adminCommentsDesc"></div>
      </div>
      <button class="sw" id="cm-sw" role="switch" aria-checked="false" data-i18n-aria="adminCommentsTitle" disabled></button>
    </div>
  </section>

  <div class="note" id="note"></div>
</div>

__I18N__
<script>
/* 和主页面同一个语言层：容器打开时带 `?lang=`，判据见 docs/i18n.md。 */
const T = I18N.t, L = I18N.lang;
I18N.applyStatic();
const $ = (id) => document.getElementById(id);
let actionToken;

function render(d){
  actionToken = d.actionToken;
  const f = d.friends || {}, p = d.production || {};

  // 好友
  $("friends").innerHTML = "";
  $("friends").append(f.count == null ? "—" : String(f.count));
  const unit = document.createElement("small");
  unit.textContent = T("adminFriendsUnit");
  $("friends").appendChild(unit);
  $("friends-sub").textContent = T("privateAudienceInfo");

  // 好友多起来这一片会很长：先露 12 位（主人排在最前，他自己一眼要看见），其余收成一枚。
  const people = $("people");
  people.innerHTML = "";
  const all = (f.list || []).slice().sort((a, b) => (b.is_owner ? 1 : 0) - (a.is_owner ? 1 : 0));
  const CAP = 12, shown = all.slice(0, CAP), rest = all.length - shown.length;
  shown.forEach((x) => {
    const el = document.createElement("span");
    el.className = "person" + (x.is_owner ? " me" : "");
    el.title = (x.nickname || x.id) + (x.is_owner ? T("adminOwnerTag") : "");
    if (x.avatar_url) {
      const im = document.createElement("img");
      im.src = x.avatar_url; im.alt = ""; im.loading = "lazy";
      el.appendChild(im);
    }
    const nm = document.createElement("i");
    nm.textContent = x.nickname || x.id;
    el.appendChild(nm);
    people.appendChild(el);
  });
  if (rest > 0) {
    const more = document.createElement("span");
    more.className = "person more";
    const i = document.createElement("i");
    i.textContent = T("adminMore", {n: rest});
    more.appendChild(i);
    more.title = all.slice(CAP).map((x) => x.nickname || x.id).join(T("optSep"));
    people.appendChild(more);
  }

  // 产出
  $("total").innerHTML = "";
  $("total").append(p.total == null ? "—" : String(p.total));
  const t2 = document.createElement("small");
  t2.textContent = T("adminSongsUnit");
  $("total").appendChild(t2);
  $("split").textContent = T("adminSplit",
    {own: p.owner_total ?? 0, guest: p.guest_total ?? 0, n: p.guests ?? 0});
  $("today").textContent = p.today_total ?? "—";
  $("d7").textContent = p.last7 ?? "—";
  $("d30").textContent = p.last30 ?? "—";
  $("proj").textContent = p.projects ?? "—";

  // 近 14 天
  const series = p.days || [];
  const max = Math.max(1, ...series.map((x) => x.total));
  const chart = $("chart");
  chart.innerHTML = "";
  series.forEach((x) => {
    const col = document.createElement("div"); col.className = "col";
    const wrap = document.createElement("div"); wrap.className = "barwrap";
    const bar = document.createElement("div"); bar.className = "bar";
    bar.style.height = Math.round((x.total / max) * 100) + "%";
    if (x.total) bar.title = T("adminBarTip",
      {date: x.date, total: x.total, own: x.owner, guest: x.guests});
    if (x.owner)  { const s = document.createElement("div"); s.className = "seg own"; s.style.height = (x.owner / x.total * 100) + "%"; bar.appendChild(s); }
    if (x.guests) { const s = document.createElement("div"); s.className = "seg gst"; s.style.height = (x.guests / x.total * 100) + "%"; bar.appendChild(s); }
    wrap.appendChild(bar);
    const day = document.createElement("div"); day.className = "day";
    day.textContent = x.date.slice(5);
    col.appendChild(wrap); col.appendChild(day);
    chart.appendChild(col);
  });

  // 设置：开关的真值永远来自服务端这一份，不是页面自己记着的
  const sw = $("cm-sw");
  sw.setAttribute("aria-checked", (d.conf || {}).comments ? "true" : "false");
  sw.disabled = false;

  $("stamp").textContent = T("adminReadAt", {t: new Date(d.server_time || Date.now())
    .toLocaleString(L, {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit"})});
}

async function load(){
  try{
    const r = await fetch("/api/admin", {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  }catch(e){
    $("stamp").textContent = T("adminLoadFailed", {err: e.message});
  }
}

$("cm-sw").addEventListener("click", async () => {
  const sw = $("cm-sw"), next = sw.getAttribute("aria-checked") !== "true";
  sw.disabled = true;
  try{
    const r = await fetch("/api/admin?" + new URLSearchParams({op:"set", key:"comments", on:next?"1":"0", token:actionToken}),
                          {method:"POST", cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  }catch(e){
    sw.disabled = false;
    $("stamp").textContent = T("adminSaveFailed", {err: e.message});
  }
});

$("reload").addEventListener("click", load);
/* 首屏用服务端内联的那一份直出 —— 不等一趟 fetch（隧道上那是一个完整往返）。
   之后的轮询照常走 /api/admin。内联失败（老页面、或者模板没替换）就退回原来的路。 */
try { render(__ADMIN__); } catch (_) { load(); }
setInterval(load, 60000);
</script>
</body>
</html>
