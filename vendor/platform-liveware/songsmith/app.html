/* ── ② 创作引导：每题都给选项（PM #2）── */
/* 五道题的取舍有个外部约束：模型的 style prompt 要五样 —— 语言、曲风、人声、乐器、节奏
   （SKILL.md「Writing the style prompt」/ yue2-craft.md）。而纪律禁止参数面板（§4：不出现
   BPM / 调式 / 乐器的控件）。所以**乐器和节奏不设题，改由占位符教他说出来** ——
   「一把吉他，慢一点」这一句就同时给了乐器和速度，比两个下拉框自然，也不违纪。

   选项一律是普通人说得出口的词，不是音乐术语；**不点名艺人**（版权与风格模仿都有争议，
   而且「像某某」对模型来说反而比「一把吉他」更含糊）。 */
const QUIZ = [
  { k:"who", q:T("quizWho"), h:"",
    opts:T("quizWhoOpts"), free:T("quizWhoFree") },
  { k:"why", q:T("quizWhy"), h:"",
    opts:T("quizWhyOpts"), free:T("quizWhyFree") },
  { k:"feel", q:T("quizFeel"), h:T("quizFeelHint"), multi:true,
    opts:T("quizFeelOpts"), free:T("quizFeelFree") },
  { k:"style", q:T("quizStyle"), h:T("quizStyleHint"), multi:true,
    opts:T("quizStyleOpts"), free:T("quizStyleFree") },
  { k:"voice", q:T("quizVoice"), h:"",
    opts:T("quizVoiceOpts"), free:T("quizVoiceFree") },
  /* 语言是 style prompt 的第一样。**默认跟界面语言走，但选择面一格不收窄**
     （PM 2026-09-22 / docs/i18n.md §3）：界面语言是「我读得懂什么」，唱哪种语言是
     创作意图 —— 一个中文用户完全可能想要英文歌。所以每个 locale 的选项都是
     「当地语打头 + 常见语种 + 混唱」，默认值是引导不是围栏。放在最后：它是设定不是门槛。 */
  { k:"lang", q:T("quizLang"), h:T("quizLangHint", {default: T("quizLangDefault")}),
    opts:T("quizLangOpts"), free:"" },
];
/* 单选题的答案是一个字符串；多选题（感觉 / 风格）是数组：选中的选项按点的先后排，自己写的那条排最后 */
const answerList = (q) => { const a = state.quiz.a[q.k]; return Array.isArray(a) ? a : a ? [a] : []; };
/* 三种进门方式（design.md §10）。答题是原来的；哼一段 / 画一段给的是**旋律**，答题给的是**话** ——
   两者可以叠：先哼再答题，开场白里既有「写给谁」也有「曲子用我哼的那段」。 */
/* 创作页那三个页签共用的外壳（大标题 + 页签行），和**只有它们各自那块**的身体。
   分开是为了换页签时外壳一动不动 —— 见 render() 里那段（handoff §40）。 */
const CREATE_HEAD = () => `<h2 class="big">${T("createH")}</h2>` + waysBar();
const swapBox = (html) => `<div class="swap">${html}</div>`;
function waysBar(){
  const W = [["quiz", T("wayQuiz")], ["hum", T("wayHum")], ["draw", T("wayDraw")]];
  return `<div class="mine-entry"><div class="ttabs" role="tablist">${W.map(([k, l]) =>
    `<button class="ttab" role="tab" aria-selected="${state.create === k}" data-way="${k}">${l}</button>`).join("")}</div></div>`;
}
function renderCreate(){
  const st = state.quiz;
  loadMelody().catch(() => {});                 // 进了创作页就把转写脚本备好，点「开始」时不用等
  if (state.create === "hum") return CREATE_HEAD() + swapBox(renderHum());
  if (state.create === "draw") return CREATE_HEAD() + swapBox(renderDraw());
  if (st.step >= QUIZ.length) return renderSeed();
  const cur = QUIZ[st.step], list = answerList(cur);
  const isOn = (o) => list.includes(o);
  const freeText = list.filter(x => !cur.opts.includes(x)).join(T("optSep"));
  const mel = state.melody;
  return CREATE_HEAD() + swapBox((mel ? `
    <p class="mel-line">${T("melLine", {verb: melVerb(mel)})}
      <button data-nav="dropmelody">${T("melDrop")}</button></p>` : "") + `
    <div class="quiz">
      <div class="prog"><i style="width:${st.step/QUIZ.length*100}%"></i></div>
      <div class="quiz-step">${st.step+1} / ${QUIZ.length}</div>
      <h3 class="quiz-q">${esc(cur.q)}</h3>
      <p class="quiz-h">${esc(cur.h || "")}</p>
      <div class="opts">${cur.opts.map(o =>
        `<button class="opt" data-opt="${esc(o)}" aria-pressed="${isOn(o)}">${esc(o)}</button>`).join("")}</div>
      <textarea id="qa" rows="2" placeholder="${esc(cur.free||T("quizFreeFallback"))}">${esc(freeText)}</textarea>
      <div class="quiz-nav">
        ${st.step>0?`<button class="btn ghost" data-nav="-1">${T("quizPrev")}</button>`:""}
        <button class="btn" data-nav="1">${st.step===QUIZ.length-1?T("quizSeeSeed"):T("quizNext")}</button>
        <button class="quiz-skip" data-nav="skip">${T("quizSkip")}</button>
      </div>
    </div>`);
}
const melVerb = (mel) => mel.kind === "draw" ? T("verbDraw") : T("verbHum");
/* 一个选项是从预设里点的，还是他自己写的 —— 预设的要套进句式（「因为生日」），
   自己写的多半已经是一整句（「像说话一样，别太用力」），再套模板就读不通了。
   判据是**在不在选项表里**，不是字数：`length > 6` 在中文里勉强够用，在英文 / 西语里
   每个预设选项都超过六个字符，套模板那一路会整条失效。 */
const isPreset = (k, v) => (QUIZ.find(q => q.k === k) || {opts: []}).opts.includes(v);
function seedText(){
  const a = state.quiz.a, bits = [];
  const joined = (k) => { const v = a[k]; return (Array.isArray(v) ? v : v ? [v] : []).filter(Boolean).join(T("optSep")); };
  if (a.who)  bits.push(T("seedFor", {who: a.who}));
  if (a.why)  bits.push(isPreset("why", a.why) ? T("seedBecause", {why: a.why}) : a.why);
  if (joined("feel"))  bits.push(T("seedFeel", {feel: joined("feel")}));
  if (joined("style")) bits.push(T("seedStyle", {style: joined("style")}));
  if (a.voice && a.voice !== T("quizVoiceAny"))
    bits.push(isPreset("voice", a.voice) ? T("seedVoice", {voice: a.voice}) : a.voice);
  // 歌唱哪种语言默认跟界面语言走（PM 2026-09-22），所以「默认不必写进话里」这条
  // 省略规则也跟着走：韩语界面下选了韩语不写，中文界面下选了中文不写。
  if (a.lang && a.lang !== T("quizLangDefault")) bits.push(T("seedLangSung", {lang: a.lang}));
  // 旋律是他自己哼的 / 画的：开场白点名编号，她按 hums/<编号>.abc 照谱写词、出歌（SKILL.md「When they hum」）
  const mel = state.melody;
  if (mel) {
    const p = {verb: melVerb(mel), id: mel.id};
    return bits.length ? T("seedWithMelody", {...p, bits: I18N.joinList(bits)})
                       : T("seedWithMelodyBare", p);
  }
  return bits.length ? T("seedFull", {bits: I18N.joinList(bits)}) : T("seedBlank");
}
function renderSeed(){
  const text = seedText(), mel = state.melody;
  const answered = Object.values(state.quiz.a).some(v => Array.isArray(v) ? v.length : v);
  return `<h2 class="big">${T("seedH")}</h2>
    <div class="seed-out">
      <div class="seed-h"><span class="seed-l">${mel ? T("seedLabelMel", {verb: melVerb(mel)}) : T("seedLabel")}</span>
        <button class="copy" data-copy="${esc(text)}">${T("copy")}</button></div>
      <div class="seed-b">${esc(text)}</div>
    </div>
    <div class="quiz-nav">
      ${toHer(text) ? `<a class="btn" href="${esc(toHer(text))}">${ICON.send}<span>${T("sendToHer")}</span></a>` : ""}
      <button class="btn ghost" data-nav="restart">${answered ? T("seedRedo") : T("seedStart")}</button>
      ${mel ? `<button class="quiz-skip" data-nav="dropmelody">${T("melDropLong")}</button>` : ""}
    </div>`;
}

/* ── 哼一段 / 画一段：旋律层的两个入口 ──
   模型不听音频，只读谱（yue2-craft.md §1）。所以「哼一段」不是把录音交给她，是**在这里就转成谱**：
   录音（带拍子）→ 逐帧测音高 → 切成音 → 按 1/16 网格量化 → 写成她那份谱的方言（static/melody.js，

async function humStart(){

  const ctx = getAudioCtx();
  if (!ctx || !M.hasAudio) { HUM.phase = "failed"; HUM.err = "noaudio"; render(true); return; }
  const rec = new M.Recorder();

    await rec.start({ ctx, maxSeconds:HUM_MAX_S,
      onFrame:(m, t, rms) => {
        if (HUM.rec !== rec || HUM.phase !== "rec") return;
        HUM.live.push([t, m, rms]);
        if (Math.floor(t) !== Math.floor(HUM.secs)) { const el = document.querySelector(".tune-t"); if (el) el.textContent = fmtSecs(t); }
        HUM.secs = t;

    const res = window.Melody.transcribe(r.pcm, { layout:"auto" });   // 速度估、节奏和音高整理，都在里面

function humAction(a){

/* 谱走 GET 分片（和封面同一套：relay 剥 POST body，且 URL 有约 11KB 的天花板 —— handoff §27），

async function putMelody(kind, r){
  const bytes = new TextEncoder().encode(r.abc), id = Math.random().toString(36).slice(2, 10), CH = 3072;

/* 画板：手指 / 鼠标一笔一笔画，抬笔算一笔。笔画归一化到 0..1 存着，画布尺寸变了也不失真。 */

/* 生成中：服务报的是 planning / composing / synthesizing / decoding …

/* 从「发现」那边过来的返回钮：回哪一层要看他是从哪一层进来的 —— 发现页本身，还是

   所以「从我分享的进去改分享，改完返回」落回的是我分享的，不是发现页（PM 2026-09-21）。 */
const DISCOVER_SUB = ["shared", "liked"];
function discoverBack(where){
  return DISCOVER_SUB.includes(where)
    ? `<button class="back" data-minepage="${where}">${ICON.back}<span>${where === "liked" ? T("minePageLiked") : T("minePageShared")}</span></button>`
    : backBtn("discover", T("discoverH"));
}
/* 项目页就是版本列表 —— 歌词、分享、下载都挂在每一版上（PM 2026-09-16：
   「歌词和分享是歌曲列表的二级功能，每首歌对应一版歌词」） */
function renderProject(){
  const p = DATA.projects[state.project];
  if (state.page) { const t = (p.takes||[])[state.page.t];
    if (t) return state.page.kind === "share" ? renderTakeShare(p, t, state.page.t) : renderTakeLyrics(p, t, state.page.t);
    state.page = null; }
  /* 三层：身份（封面 + 名字 + ⋯）· 分段标题 · 版本列表。
     `⋯` 收的是**项目**这一层的事（换封面 / 删除项目），和每一行那枚 ⋯（管的是那一版）
     是两回事 —— 同一个字形，但挂在各自的对象上，所以不会混。
     它原本是一枚写着「换封面」的裸文字按钮，贴在标题右边：这一页其它二级动作全是行上的
     ⋯，只有它是文字，而且离它要改的那张封面隔着整个标题区。 */
  return `${backBtn("back", T("mineH"))}
    <div class="head">${art(p.title,"96px")}
      <div class="head-m"><h2 class="head-t">${esc(p.title)}</h2>
        ${p.brief ? `<div class="head-s">${esc(p.brief)}</div>` : ""}</div>
      </div>
    ${renderSongs(p)}`;
}
/* 版本谱系：V2 是从 V1 精修来的 —— 不显示的话，一列小样看上去全是平行的重抽 */
function parentOf(p, t){
  if (!t.parent) return -1;
  return (p.takes||[]).findIndex(x => x.id === t.parent);
}
function takeRow(p, t, i){
  const cur = state.cur && state.cur.src === t.audio;
  const playing = cur && state.playing, loading = cur && state.loading;
  const v = vOf(t, i), pi = DATA.projects.indexOf(p);
  const sub = takeSub(p, t);
  return `<div class="song ${cur?"now":""}" role="button" tabindex="0" data-play="${i}" data-src="${esc(t.audio)}">
    ${art(p.title,"52px", "V"+v)}
    <div class="song-mid"><div class="song-t"><span>${esc(t.note||T("versionN", {n: v}))}</span>${t.shared?`<span class="chip on">${T("projShared")}</span>`:""}</div>
      ${sub ? `<div class="song-s">${esc(sub)}</div>` : ""}</div>
    <div class="song-r">
      <span class="dur">${esc(t.dur||"")}</span>
      <span class="mini ind ${playing?"on":cur?"cur":""}">${loading ? SPIN_S : playing ? EQ : PLAY_S}</span>
      
      <span class="mini" data-more="${i}" data-stop="1" role="button" title="${esc(T("more"))}">${ICON.more}</span>
    </div></div>`;
}
function renderSongs(p){
  const ts = p.takes||[], making = (p.busy||[]).map(j => makingRow(p, j)).join("");
  if (!ts.length && making) return making;
  if (!ts.length) return emptyBox(T("noTakesT"), p.lyrics ? T("noTakesWithLyrics") : T("noTakesNoLyrics"))
    + (p.lyrics ? `<div style="margin-top:14px">${lyricsCard(p.lyrics, T("askLyricsFile", {title: p.title}))}</div>` : "");
  /* 分段标题：项目那一块讲「这是什么歌」，这一行之下讲「它有哪几版」。
     PM 2026-09-20：两者之间要有清晰的分隔排版逻辑 —— 此前列表紧贴着标题，
     第一行看上去像标题的一部分。 */
  return making + `<div class="group-h vers"><span class="vers-l">${T("takesHead", {n: ts.length})}</span></div>
    <div class="list">${ts.map((t,i)=>takeRow(p,t,i)).join("")}</div>`;
}
/* 每一版的 ⋯：精修 / 歌词 / 分享 / 下载 —— 写出字来，图标一个人认不全 */
function openMenu(i, anchor, pi){
  const pj = pi == null ? state.project : pi;          // 队列面板里的一行可能不属于当前打开的项目
  const p = DATA.projects[pj], t = p && (p.takes||[])[i];
  if (!t) return;
  const v = vOf(t, i), dl = toHer(T("askTakeFile", {title: p.title, v}));
  const pop = $("pop");
  pop.hidden = false; pop.className = "pop menu"; pop.dataset.kind = "menu"; pop.dataset.take = i; pop.dataset.proj = pj;
  pop.innerHTML = `
    <button class="mitem" data-menu="lyrics:${i}">${ICON.lyr}<span>${T("menuLyrics")} / ${T("scoreBox")}</span></button>`;

  pop.style.left = Math.max(12, Math.min(r.right - pop.offsetWidth, document.documentElement.clientWidth - pop.offsetWidth - 12)) + "px";

/* 项目这一层的 ⋯：换封面 / 删除项目。PM 2026-09-20：「项目管理和封面修改作为一组」。 */
function openProjectMenu(pi, anchor){
  const p = DATA.projects[pi];
  if (!p) return;

  pop.hidden = false; pop.className = "pop menu"; pop.dataset.kind = "menu"; pop.dataset.proj = pi;

/* 弹层贴着触发它的那枚按钮放，并且不越出屏幕 / 不被底部播放条盖住。 */
function placePop(pop, anchor){
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(r.right - pop.offsetWidth, document.documentElement.clientWidth - pop.offsetWidth - 12)) + "px";
  const dock = document.querySelector(".dock").getBoundingClientRect().height;
  pop.style.top = Math.max(12, Math.min(r.bottom + 6, innerHeight - dock - pop.offsetHeight - 10)) + "px";
}
/* 删除要问一次 —— 它是这个页面上唯一拿不回来的动作。
   问法上有意不用「确定吗」：把**会没掉什么**说出来（几版、词、分享出去的那份），
   让人看着具体的东西做决定，而不是看着一句客套话点「确定」。 */
function askDelete(kind, pi, ti){
  const p = DATA.projects[pi];
  if (!p) return;
  const pop = $("pop");
  let title, body;
  if (kind === "project") {
    const n = (p.takes || []).length;
    const shared = (p.takes || []).filter(t => t.shared).length;
    title = esc(T("delProjectT", {title: p.title}));
    const what = [n ? T("delNVersions", {n}) : null, p.lyrics ? T("delLyrics") : null]
                   .filter(Boolean).join(T("optSep"));
    body = (what ? T("delWillRemove", {what}) : "") +
           (shared ? T("delSharedWarn", {n: shared}) : "") +
           T("delGone");
  } else {
    const t = (p.takes || [])[ti];
    if (!t) return;
    const last = (p.takes || []).length === 1;
    title = esc(T("delTakeT", {v: vOf(t, ti)}));
    /* 最后一版要提前说：项目本身不会跟着删（PM 2026-09-20 要的是两个独立动作），
       但没有任何一版之后，页面上这个项目的名字会退回她建项目时用的那个短名 ——
       标题本来就是从某一版的 sidecar 上读的，一版都没有就没处读。不说的话，
       用户会以为名字被删丢了。 */
    body = (t.shared ? T("delTakeSharedWarn") : "")
         + (last ? T("delLastTakeWarn", {title: p.title, slug: slugOf(p)}) : "")
         + T("delGone");
  }
  pop.hidden = false; pop.className = "pop confirm"; pop.dataset.kind = "confirm";
  pop.innerHTML = `<div class="pop-t">${title}</div>
    <div class="pop-c">${esc(body)}</div>
    <div class="pop-f">
      <button class="btn ghost sm" data-del="cancel">${T("cancel")}</button>
      <button class="btn sm" data-del="${kind}:${pi}:${ti == null ? "" : ti}">${T("del")}</button>
    </div>`;
  pop.style.left = Math.round((document.documentElement.clientWidth - pop.offsetWidth) / 2) + "px";
  pop.style.top = Math.round(Math.max(60, innerHeight * 0.3)) + "px";
}
/* 删除（serve.py /api/delete，和分享 / 喜欢一样纯 GET —— relay 不认 POST body）。
   `state.project` 是**下标**，而删完之后数组会移位，所以删之前记住 slug、删完按 slug 找回来；
   找不回来（整个项目没了）就退回「我的歌」。 */
async function delCall(kind, pi, ti){
  const p = DATA.projects[pi];
  if (!p) return;
  const slug = slugOf(p);
  const gone = kind === "project" ? (p.takes || []).map(t => t.audio)
                                  : [((p.takes || [])[ti] || {}).audio];
  const q = kind === "project" ? {op: "project", project: slug}
                               : {op: "take", audio: (gone[0] || "").split("/").pop()};
  if (kind === "take" && !q.audio) return;
  try {
    const r = await fetch("/api/delete?" + new URLSearchParams(q), {cache: "no-store"});
    if (!r.ok) throw new Error("delete " + r.status);
    if (state.cur && gone.includes(state.cur.src)) stopPlayback();   // 正在放的那首被删了
    await reloadData(await r.json());
    const back = DATA.projects.findIndex(x => slugOf(x) === slug);
    state.project = back < 0 ? null : back;      // != -1 判空：第一个项目的下标是 0
    state.page = null; state.refine = null;
    if (state.project == null) state.tab = "mine";
    go();
    toast(kind === "project" ? T("delProjectDone") : T("delTakeDone"));
  } catch (_) {
    toast(T("delFailed"));
  }
}
/* 歌词精校：听一遍这一版的声音，把每句的位置量准（serve.py /api/refine）。

   **默认不做，创作者点一次**（PM 2026-09-20）—— 它不免费：一首歌要占 GPU 十几秒、
   传 0.9 MB、整趟约 90 秒。哪首值得，创作者比我们清楚。
   精校过的版本不再有这个按钮，只剩一枚「已精校」的牌子。

   接口立刻返回（90 秒的请求会被 relay 掐断），真活在服务端后台跑，所以这里自己轮询。
   ⚠️ 轮询要有上限：服务端的标记 20 分钟过期，页面比它先放手，别让一枚「精校中」
   在界面上转到天荒地老（今天刚被一个没有过期的标记坑过）。 */
async function refineLyrics(src){
  if (!src || state.refining) return;
  state.refining = true;
  try {
    const r = await fetch("/api/refine?" + new URLSearchParams({audio: src}), {cache: "no-store"});
    if (!r.ok) throw new Error("refine " + r.status);
    await reloadData(await r.json());
    render();
    toast(T("refineStarted"));
    for (let i = 0; i < 60; i++) {                 // 60 × 5s = 5 分钟封顶
      await new Promise(res => setTimeout(res, 5000));
      await reloadData();
      const still = (DATA.projects || []).some(p => (p.takes || []).some(
        t => (t.audio || "").endsWith(src) && t.refining));
      if (!still) {
        render();
        const done = (DATA.projects || []).some(p => (p.takes || []).some(
          t => (t.audio || "").endsWith(src) && (t.timing || {}).kind === "measured"));
        toast(done ? T("refineDone") : T("refineMissed"));
        return;
      }
    }
    toast(T("refineSlow"));
  } catch (_) {
    toast(T("refineFailed"));
  } finally {
    state.refining = false;
  }
}
/* 正在放的那首被删了：停下来、把播放条清空，别留一个点了没反应的条。 */
function stopPlayback(){
  au.pause(); au.removeAttribute("src"); au.load();
  state.cur = null; state.playing = false; state.loading = false; state.stalled = false; state.seekable = false;
  state.fallback = false; state.blobReady = null; state.queue = []; state.qi = -1;
  renderBar();
}

/* 词和歌是两类资产，但词跟着版本走：这一版唱的是这几句。
   下载同样走深链接 —— 页面不经手文件，由她用文件发送给出。 */

function takeHead(p, t, i, kicker){

  const fromDiscover = from === "discover" || DISCOVER_SUB.includes(from);
  return `${fromDiscover ? discoverBack(from) : backBtn("back", p.title)}

function renderTakeLyrics(p, t, i){

/* ── 精修：一首歌一个页面（PM 2026-09-16）──
   入口在歌曲资产上和播放界面上，不在项目层 —— 「精修」修的是**这一版唱得怎么样**，
   而一个项目里不同版本的毛病各不相同。
   操作面是**歌词**不是谱：不懂乐理的人听到的是「这句咬字含糊」，不是「第 14 小节」。 */
function refineTake(){
  const p = DATA.projects[state.refine.p];
  return [p, (p.takes||[])[state.refine.t]];
}
function hasScore(t){ return (t.segments||[]).length > 0; }

function renderRefine(){
  const [p, t] = refineTake();
  if (!t) { state.refine = null; return renderMine(); }

    <div class="lines">${al.map((a, si) => `
      <div class="lsec">
        <div class="lsec-h"><span class="sec-t">${esc(secLabel(a.tag))}</span>
          <span class="sec-raw">[${esc(a.tag)}]</span>
          <span class="lsec-t">${a.t0!=null?mmss(a.t0):""}</span></div>
        ${a.lines.map((line, li) => {
          const id = si+":"+li, note = noteText(id);
          const on = state.line === id;
          return `<div class="lrow ${on?"on":""} ${note?"noted":""} ${state.activeLine===id?"live":""}" data-line="${id}"
              ${a.lineT?`data-lplay="${a.lineT[li]}"`:""}>
            ${a.lineT ? `<span class="lplay" title="${esc(T("playFromLine"))}">${PLAY_XS}</span>` : `<span class="lplay off"></span>`}
            <span class="ltext">${esc(line)}</span>
            ${note ? `<span class="lnote">${esc(note)}</span>` : ""}

        }).join("")}
      </div>`).join("")}</div>
    ${hasScore(t) ? `<details class="scorebox"><summary>${T("scoreBox")}</summary>
      ${t.segments.map(x => x.silent ? "" : `<div class="segline">
        <span class="sec-raw">${esc(T("scoreBar", {sec: secLabel(x.name), from: x.bar+1, to: x.bar+x.bars}))}</span>
        <div class="abcbox" id="abc-${x.id}"></div></div>`).join("")}
      ${t.score && toHer(T("askScoreFile", {title: p.title, v: n, score: t.score}))
        ? `<p class="after"><a class="copy" href="${esc(toHer(T("askScoreFile", {title: p.title, v: n, score: t.score})))}">${ICON.down}<span>${T("scoreDownload")}</span></a></p>` : ""}
      </details>` : ""}`;
}

/* 乐谱库只在展开谱时下载，首页和听歌不等这份大脚本。 */
let scoreLibrary = null;
function loadScoreLibrary(){
  if (window.ABCJS) return Promise.resolve(window.ABCJS);
  if (!scoreLibrary) {
    scoreLibrary = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "/static/abcjs-basic-min.js?v=__V__";
      script.async = true;
      script.onload = () => {
        if (window.ABCJS) resolve(window.ABCJS);
        else { script.remove(); reject(new Error("Score library unavailable")); }
      };
      script.onerror = () => { script.remove(); reject(new Error("Score library unavailable")); };
      document.head.appendChild(script);
    }).catch(error => { scoreLibrary = null; throw error; });
  }
  return scoreLibrary;
}

/* 谱只在展开后才画 —— 它是资产，不是操作面 */
async function drawScores(){
  const box = document.querySelector(".scorebox");
  if (!box || !box.open || box.dataset.drawn || box.dataset.loading) return;
  const [, t] = refineTake();
  box.dataset.loading = "1";
  box.querySelectorAll(".abcbox").forEach(host => host.textContent = T("scoreLoading"));
  try {
    const abc = await loadScoreLibrary();
    if (!box.isConnected || !box.open) return;
    (t.segments||[]).forEach(x => {
      const host = $("abc-" + x.id);
      if (!host || !x.abc) return;
      host.textContent = "";
      abc.renderAbc(host, x.abc, {
        add_classes:true, responsive:"resize", staffwidth: innerWidth < 640 ? 560 : 1100,
        paddingtop:2, paddingbottom:2, paddingleft:0, paddingright:0, selectTypes:false });
    });
    box.dataset.drawn = "1";
  } catch {
    if (box.isConnected) box.querySelectorAll(".abcbox").forEach(host =>
      host.textContent = T("scoreFailed"));
  } finally {
    delete box.dataset.loading;
  }
}

/* 攒好的话：坐标是「哪一段的第几句 + 那句词」——
   她拿着这句话能直接定位，而用户从头到尾没碰过一个乐理词。 */
function noteText(id){ return ((state.notes[id]||{}).text||"").trim(); }
function noteList(){
  return Object.entries(state.notes)
    .filter(([, v]) => (v.text||"").trim())
    .sort((a, b) => a[0].split(":").map(Number)[0] - b[0].split(":").map(Number)[0]
                 || a[0].split(":").map(Number)[1] - b[0].split(":").map(Number)[1])
    .map(([id, v]) => ({id, ...v}));
}
/* 建议是「那一版歌」的，不是当前页面的 —— 所以每条都随手记下它属于哪一段哪一句，
   人走到别的页面，那枚气泡照样能把话拼完整发出去。 */
function draftText(){
  const c = state.pending;
  const items = noteList();
  if (!c || (!items.length && !state.keepScore)) return "";
  const out = items.map(n => T("draftLine",
    {sec: secLabel(n.tag), n: n.li+1, line: n.line, text: n.text.trim()}));
  if (state.keepScore && c.score)
    out.push("", T("draftKeepScoreFile", {score: c.score}));
  else if (state.keepScore)
    out.push("", T("draftKeepScore"));
  return [T("draftHead", {title: c.title, v: c.v}), "", ...out].join("\n");
}
/* ── 建议气泡 + 它打开的那一层 ── */
function renderBubble(){
  const el = $("bubble"), c = state.pending, n = noteList().length;
  const show = !!c && (state.refine || n);      // 精修页里 0 条也露着，教会这个入口
  el.className = "bubble" + (show ? " on" : "");
  if (!show) { $("sheet").className = "sheet"; setDockVar(); return; }
  el.innerHTML = `${ICON.bub}<span>${T("notesBtn")}</span><b>${n}</b>`;
  renderSheet();
}
function renderSheet(){
  const el = $("sheet"), c = state.pending;
  if (!state.sheetOpen || !c) { el.className = "sheet"; setDockVar(); return; }
  const items = noteList(), txt = draftText(), dl = txt ? toHer(txt) : null;

/* ── 写一条建议：悬浮窗，不是就地展开 ── */
function openPop(id, anchor){
  const meta = state.notes[id] || lineMeta(id);
  if (!meta) return;
  state.line = id;
  const pop = $("pop");
  pop.hidden = false; pop.className = "pop"; pop.dataset.kind = "note"; delete pop.dataset.take;
  pop.innerHTML = `<div class="pop-h"><span>${esc(T("popLine", {sec: secLabel(meta.tag), n: meta.li+1}))}</span>
      <span class="pop-q">「${esc(meta.line)}」</span></div>
    <textarea id="popIn" placeholder="${esc(T("popPlaceholder"))}">${esc((meta.text||""))}</textarea>
    <div class="pop-f">
      ${state.notes[id] ? `<button class="pop-x" data-delnote="${id}">${T("popDel")}</button>` : ""}
      <button class="pop-x ok" data-closepop="1">${T("popOk")}</button></div>`;
  // 桌面贴着那一句，窄屏用 CSS 落到底部
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(r.left - 300, document.documentElement.clientWidth - pop.offsetWidth - 12)) + "px";
  // 下边界按停靠区（播放条 / 面板）的实际高度算，别压在它上面
  const dock = document.querySelector(".dock").getBoundingClientRect().height;
  pop.style.top = Math.max(12, Math.min(r.bottom + 8,
      innerHeight - dock - pop.offsetHeight - 10)) + "px";
  const ta = $("popIn");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.oninput = () => {
    const v = ta.value;
    if (v.trim()) state.notes[id] = {...meta, text: v};
    else delete state.notes[id];
    document.querySelectorAll(`[data-bub="${id}"]`).forEach(b =>
      b.classList.toggle("has", !!v.trim()));
    renderBubble();
  };
}
function closePop(silent){
  const pop = $("pop");
  if (pop.hidden) return;
  const wasNote = pop.dataset.kind === "note";
  pop.hidden = true; pop.innerHTML = ""; pop.className = "pop"; delete pop.dataset.kind; delete pop.dataset.take; delete pop.dataset.proj;
  state.line = null;
  if (wasNote && !silent) render();          // 把那一句的摘要补回行里
}
function lineMeta(id){
  if (!state.refine) return null;
  const [, t] = refineTake();
  const [si, li] = id.split(":").map(Number);
  const a = (t.align || [])[si];
  return a ? {tag: a.tag, li, line: (a.lines[li]||"").trim()} : null;
}

/* ── ④ 分享：一版一版地分（分享的是这一首，不是整个项目） ── */
const takeKey = (t) => t.id || t.audio;
function shareFor(t){
  const s = state.share;
  if (s.key !== takeKey(t)) Object.assign(s, {key: takeKey(t), title: t.sharedTitle, desc: t.sharedDesc || ""});
  return s;
}
function shareDirty(p, t){
  const s = shareFor(t);
  if (!t.shared) return true;
  return (s.title ?? p.title) !== t.sharedTitle || (s.desc||"") !== (t.sharedDesc||"");
}
function renderTakeShare(p, t, i){

    <p class="lede">${T("shareLede")}</p>

    <div class="field"><label>${T("shareDesc")} <span class="opt-req">${T("shareOptional")}</span></label>
      <textarea id="sh-desc" rows="2" placeholder="${esc(T("shareDescPh"))}">${esc(s.desc||"")}</textarea></div>
    ${(t.tags||[]).length ? `<div class="field"><label>${T("shareTags")}</label>
      <div class="sp-tags ro">${t.tags.map(x => `<span class="chip">${esc(tagLabel(x))}</span>`).join("")}</div>
      <p class="note">${T("shareTagsNote")}</p></div>` : ""}
    <div class="quiz-nav">
      <button class="btn" id="sh-go" ${(!dirty||state.shareBusy)?"disabled":""}>
        ${state.shareBusy ? T("shareBusy") : t.shared ? (dirty?T("shareUpdate"):T("shareUnchanged")) : T("shareGo")}
      </button>
      ${t.shared?`<button class="btn ghost" data-nav="unshare">${T("shareUndo")}</button>`:""}
      ${state.shareDone?`<span class="ok">${T("shareDone")}</span>`:""}
    </div></div>`;
}

/* 标签从服务端来的是稳定 key（`lang.zh` / `genre.rock`），到这里才变成词 ——
   于是筛选天然跨语种：比的是 key，中文用户和韩语用户点的是同一枚 chip。
   认不出的原样留着：那是她自己写进 sidecar 的自由标签（serve.py `song_tags` 的覆盖路径）。 */
const tagLabel = (k) => I18N.has(k) ? T(k) : k;

/* ── ⑤ 发现：自己的分享置顶（最多露 3 条，多了收起），每条能进去改；下面是大家的 ── */
/* ⚠️ 这是**标识符**不是文案：它拿去和 `sh.by` 比，判断"这首是不是我分享的"。
   翻译它会让比较随界面语言漂。署名显示走 bylineMine / bylineBy。 */
const ME = () => DATA.me || "\u6211";
function takeOfShare(sh){
  for (const [pi, p] of (DATA.projects||[]).entries()) {
    const ti = (p.takes||[]).findIndex(t => t.audio === sh.audio);
    if (ti >= 0) return {pi, ti, p, t: p.takes[ti]};
  }
  return null;
}
/* 一行 = 一首歌。**点行进它自己那一页**（转发出去的就是那个地址），**点 ▶ 直接听** ——
   列表→详情的老规矩（PM 2026-09-17 选的甲案）：入口要在每一行上，而行尾再塞第四枚图标会挤。
   于是「改分享」挪进了那一页，行尾剩 ▶ / 词 / ♥ 三枚，自己的和别人的长得一样。
   `mine` 不再由调用方给 —— 「我喜欢的」那一页里两种都有，只能逐行自己认。 */
function sharedRow(sh, i){
  const cur = state.cur && state.cur.src === sh.audio, playing = cur && state.playing;
  const mine = sh.by === ME();
  const k = mine ? takeOfShare(sh) : null;
  const sub = mine
    ? [k ? T("versionN", {n: vOf(k.t, k.ti)}) : "", sh.desc].filter(Boolean).join(" · ")
    : [sh.byName || T("aFriend"), sh.desc].filter(Boolean).join(" · ");
  return `<div class="song ${cur?"now":""}" role="button" tabindex="0" data-song="${esc(sh.sid||"")}" data-src="${esc(sh.audio)}">${art(k ? k.p.title : sh.title,"52px", k ? "V"+vOf(k.t, k.ti) : "")}
    <div class="song-mid"><div class="song-t"><span>${esc(sh.title)}</span></div>
      ${sub ? `<div class="song-s">${esc(sub)}</div>` : ""}</div>
    <div class="song-r"><span class="dur">${esc(sh.dur||"")}</span>
      <span class="mini ind ${playing?"on":cur?"cur":""}" data-playshared="${i}" data-stop="1" role="button" title="${esc(T("play"))}">${playing ? EQ : PLAY_S}</span>
      ${commentMark(sh)}
      <span class="likebox"><span class="mini heart" data-like="${i}" data-stop="1" role="button" aria-pressed="${!!sh.liked}" title="${esc(sh.liked?T("likeOn"):T("likeOff"))}">${ICON.heart}</span>${sh.likes ? `<span class="likes-n">${sh.likes}</span>` : ""}</span>
    </div></div>`;
}
/* 分享的歌带着它的词：播放条上照样有「词」，正在唱的那句照样托底色。
   `by` 要跟着走 —— songKey 靠它分辨「两个人各有一个同名项目」和「同一首歌的两版」。 */
function sharedObj(sh){
  const mine = sh.by === ME();
  const sub = [mine ? (sh.v ? T("versionN", {n: sh.v}) : "") : (sh.byName || T("aFriend")), sh.desc].filter(Boolean).join(" · ");
  return {title:sh.title, sub, src:sh.audio, dur:sh.dur, ms:sh.ms, bytes:sh.bytes, project:sh.project || sh.title,
          by: sh.by, badge: sh.v ? "V"+sh.v : "", label: sh.title,
          sid: sh.sid,                    // 播放条左边那块点下去落到 #/s/<sid>（handoff §38）
          lyrics: sh.lyrics, align: sh.align, timing: sh.timing,
          canRefine: sh.canRefine, refining: sh.refining};
}
function playShared(sh){
  const order = discoverRows().order.map(([x]) => x);
  let i = order.indexOf(sh);
  if (i < 0) { order.unshift(sh); i = 0; }   // 从单曲页进来的：不在这一屏的清单里就自己当队首
  setQueue(order.map(sharedObj), i);         // 队列 = 发现页当时列出来的那些（§4.4）
  playSrc(state.queue[i] || sharedObj(sh));
}
/* ── 标签筛选 ──
   **一枚入口，不是通铺**（PM 2026-09-20）：「筛选」和「我分享的 / 我喜欢的」并排，
   点开才是那张分维的表。通铺一条横滑标签条在二十来首时还行，歌一多就变成一条永远
   滑不到头的带子，而且没法表达「韩语 **且** 摇滚」——组合才是它真正要干的事。

   语义：**同维 OR、跨维 AND**。「日语 韩语」= 两者之一（同一首歌不可能既日语又韩语，
   同维取交集等于永远空）；「韩语 摇滚」= 两个条件都要满足。她自己写的标签不属于任何
   一维，各自算一个独立的 AND 条件。 */
const tagsIn = pool => [...new Set(pool.flatMap(([sh]) => sh.tags || []))];
function tagMatch(sh){
  const sel = state.tags, has = new Set(sh.tags || []), dims = DATA.tagDims || [];
  const known = new Set(dims.flatMap(d => d.tags));
  return sel.filter(t => !known.has(t)).every(t => has.has(t))
      && dims.every(d => {
           const want = sel.filter(t => d.tags.includes(t));
           return !want.length || want.some(t => has.has(t));
         });
}
/* 入口：这一屏一枚标签都没有就整个不画（老歌没有 style，也就没有标签）。
   选了几枚就在药丸上挂几 —— 和「我分享的 3」同一套写法，不另造一种记号。 */
function filterPill(pool){
  if (!tagsIn(pool).length) return "";
  const n = state.tags.length;
  return `<button class="fbtn" data-filteropen="1" aria-pressed="${state.filterOpen || !!n}" aria-label="${esc(T("filter"))}" title="${esc(T("filter"))}">${ICON.filter}${n ? `<span class="n">${n}</span>` : ""}</button>`;
}
/* 面板：**就地展开，不是浮层** —— 它属于这一屏，盖住列表就看不见筛的结果了。
   每一维只画**这一屏真出现过的**标签（`pool` 始终是筛之前的那一池，所以选着选着
   chip 不会自己消失），加上已经选中的那些。选完不自动收起：组合是要一枚一枚点的。 */
function filterPanel(pool){
  if (!state.filterOpen) return "";
  const present = new Set(tagsIn(pool)), dims = DATA.tagDims || [];
  const known = new Set(dims.flatMap(d => d.tags));
  const row = (name, ts) => !ts.length ? "" : `<div class="fil-row"><span class="fil-k">${esc(name)}</span>
    <div class="fil-v">${ts.map(t =>
      `<button class="tag" data-tagpick="${esc(t)}" aria-pressed="${state.tags.includes(t)}">${esc(tagLabel(t))}</button>`).join("")}</div></div>`;
  const rows = dims.map(d => row(T(d.name), d.tags.filter(t => present.has(t) || state.tags.includes(t)))).join("")
    + row(T("dimOther"), [...present].filter(t => !known.has(t)));   // 她自己写进 sidecar 的那些
  return `<div class="filter">${rows}<div class="fil-f">
    ${state.tags.length ? `<button class="btn ghost" data-tagclear="1">${T("filterClear")}</button>` : ""}
    <button class="btn ghost" data-filteropen="1">${T("filterClose")}</button></div></div>`;
}
/* 选中的几枚标签连起来（空结果那一行要把「筛的是什么」说回来） */
const pickedTags = () => state.tags.map(tagLabel).join(" · ");
const MINE_PAGES = () => [["shared", T("minePageShared")], ["liked", T("minePageLiked")]];
function renderDiscover(){
  const {all, mine, likes, list} = discoverRows();
  // 入口恒在（数字为 0 也在）—— 它是这两页唯一的门，藏起来就找不到了
  const entry = `<div class="mine-entry">${MINE_PAGES().map(([k, l]) => {
    const n = (k === "shared" ? mine : likes).length;
    return `<button class="entry" data-minepage="${k}"><span>${l}</span>${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("")}${filterPill(all)}</div>${filterPanel(all)}`;
  return `<h2 class="big">${T("discoverH")}</h2>${entry}` +
    (list.length ? `<div class="list">${list.map(([sh, i]) => sharedRow(sh, i)).join("")}</div>`
     : all.length ? emptyBox(T("noMatchT"), T("noMatchS", {tags: pickedTags()}),
                             {clearTag: true, label: T("clearFilter")})
                  : emptyBox(T("discoverEmptyT"), T("discoverEmptyS")));
}
/* 二级页：我分享的 / 我喜欢的。两页互切留在页里（进来之后还能换一页看），返回回发现。 */
function renderMineList(){
  const {page, list} = discoverRows(), liked = state.minePage === "liked";
  const segs = `<div class="ttabs" role="tablist">${MINE_PAGES().map(([k, l]) =>
    `<button class="ttab" role="tab" aria-selected="${k === state.minePage}" data-minepage="${k}">${l}</button>`).join("")}</div>`;
  // 两枚页签和筛选钮同一行（二级导航的那一行），筛选面板跟在行下面就地展开
  return `${backBtn("discover", T("discoverH"))}
    <div class="mine-entry">${segs}${filterPill(page)}</div>${filterPill(page) ? filterPanel(page) : ""}
    ${list.length ? `<div class="list">${list.map(([sh, i]) => sharedRow(sh, i)).join("")}</div>`
      : state.tags.length ? emptyBox(T("noMatchHereT"), T("noMatchS", {tags: pickedTags()}),
                             {clearTag: true, label: T("clearFilter")})
      : emptyBox(liked ? T("likedEmptyT") : T("sharedEmptyT"),
                 liked ? T("likedEmptyS") : T("sharedEmptyS"),
                 liked ? {tab: "discover", label: T("goDiscover")} : {tab: "mine", label: T("goMine")})}`;
}
/* ── ⑥ 单曲页 `#/s/<sid>`：一首歌自己的一屏 ──
   它是**听众视角**，和精修页（创作者视角，逐句听逐句改）不是一回事，别混。
   转发出去的就是这条地址：对方在 ClawChat 里点开，看到的就是这一屏 ——
   所以这里必须回答他的三个问题：这是什么歌、谁写的、我怎么也能有一首。 */
function renderSong(){
  const ss = DATA.shared || [], sh = ss.find(x => x.sid === state.song);
  if (!sh) return `<h2 class="big">${T("songPageH")}</h2>` +
    emptyBox(T("songGoneT"), T("songGoneS"), {tab: "discover", label: T("goDiscoverOther")});

  const cur = state.cur && state.cur.src === sh.audio, playing = cur && state.playing;
  // 署名对自己和对别人**长得一样**（都用昵称，不写「我」）—— 转发出去是什么样，
  // 分享的人自己先看得见。认不出名字的才退到「好友」。
  const by = mine ? DATA.meName : sh.byName;
  const byline = by ? T("bylineBy", {who: by}) : (mine ? T("bylineMine") : T("bylineFriend"));
  // 认不认识她，话就不一样。DATA.isFriend 三态：true 已是好友 / false 还不是 / null 不知道
  // （服务端没有好友快照）。false 时点下去 app 落的是加好友名片页（main.dart:1662 的自动
  // 降级），所以文案得先说"加她为好友"，否则按钮说的和打开的不是一回事。
  const fr = DATA.isFriend;
  const cta = fr === false ? T("ctaAddFriend")
            : fr === true  ? T("ctaAskHer")
            : T("ctaFindHer");
  const ctaWhy = fr === false ? T("ctaSubAdd") : T("ctaSub");
  const her = toHer(T("askLikeThis", {title: sh.title}));
  // 从哪一页进来的就回哪一页（`minePage` 没被清掉 = 来路是那两个二级页之一）
  const back = discoverBack(state.minePage);
  return `${back}
    <div class="sp-head">${art(sh.project || sh.title, "104px", sh.v ? "V" + sh.v : "")}
      <div><div class="sp-t">${esc(sh.title)}</div>
        <div class="sp-by">${esc(byline)}${sh.dur ? ` · ${esc(sh.dur)}` : ""}</div>
        ${sh.desc ? `<div class="sp-desc">${esc(sh.desc)}</div>` : ""}
        ${(sh.tags || []).length ? `<div class="sp-tags">${sh.tags.map(x =>
          `<button class="chip act" data-tagpick="${esc(x)}">${esc(tagLabel(x))}</button>`).join("")}</div>` : ""}
      </div></div>
    <div class="sp-acts">
      <button class="pill solid" data-playshared="${i}">${playing ? EQ : PLAY_S}<span>${playing ? T("nowPlaying") : T("play")}</span></button>
      <button class="pill heart" data-like="${i}" aria-pressed="${!!sh.liked}">${ICON.heart}<span>${T("likeOff")}</span>${sh.likes ? `<span class="n">· ${sh.likes}</span>` : ""}</button>
      ${sh.lyrics ? `<button class="pill" data-sharedlyr="${i}" aria-pressed="${cur && state.lyrOpen}">${ICON.lyr}<span>${T("lyricsShort")}</span></button>` : ""}
      <button class="pill" data-copylink="1">${ICON.link}<span>${T("copyLink")}</span></button>
      ${k ? `<button class="pill" data-editshare="${i}">${ICON.share}<span>${T("editShare")}</span></button>` : ""}
    </div>
    <p class="sp-foot">${T("spFoot")}</p>
    ${renderComments(sh)}
    ${!mine && her ? `<div class="sp-cta"><h3>${T("spCtaH")}</h3>
      <p>${esc(ctaWhy)}</p>
      <a class="btn cta" href="${esc(her)}"><span class="cta-ic">${ICON.bub}</span>${esc(cta)}</a></div>` : ""}`;
}
function openSong(sid){
  closePop(true);
  state.song = sid; state.refine = null; state.page = null; state.project = null; state.tab = "discover";
  go();
}
/* 喜欢：先把心翻过来再发请求 —— 点赞要即时，等一个来回才变色是不对的手感。
   失败就退回去，并按服务端那份重新对齐。 */
async function likeCall(sh){
  if (!sh) return;
  const want = !sh.liked;
  sh.liked = want; sh.likes = Math.max(0, (sh.likes || 0) + (want ? 1 : -1));
  render();
  try {
    const r = await fetch("/api/like?" + new URLSearchParams({op: want ? "set" : "unset", audio: sh.audio}),
                          {cache: "no-store"});
    if (!r.ok) throw new Error("like " + r.status);
    await reloadData(await r.json());
  } catch (_) {
    sh.liked = !want; sh.likes = Math.max(0, (sh.likes || 0) + (want ? -1 : 1));
    toast(T("likeFailed")); render();
  }
}
/* ── 评论（2026-09-21，PM 提）──────────────────────────────────────────
   只长在**分享出去的歌**上：单曲页是它的家，发现页的行上只露一个数。
   自己树里没分享的版本没有观众，那儿不该有留言入口。

   和「喜欢」的分野在服务端 `attach_comments` 上写着：喜欢是无声信号，所以只给计数不给
   名单；评论是主动发言，署名是它的一部分。两件事，不是同一条判据的两面。 */

/* 行上的评论数：有才画。它是**信息，不是控件** —— 行尾那三枚（▶ / 词 / ♥）都能点，
   这一枚和它左边的时长一样，只告诉你「这首下面有人说话」。所以不做成第四枚圆钮：
   「行尾再塞第四枚图标会挤」那条判断（PM 2026-09-17 选甲案时定的）没有变。 */
function commentMark(sh){
  // 主人关掉评论时这一枚也要跟着消失 —— 否则行上说有 3 条，点进去那一屏却没有评论区。
  // 服务端照常把评论挂在 data 上（关掉不等于删掉），所以这道判断只能在页面这边做。
  if (!DATA.commentsOn) return "";
  const n = (sh.comments || []).length;
  // **和喜欢同一套壳**（PM 2026-09-21）：`.likebox` + 右上角 `.likes-n` 角标，挨着♥站。
  // 行上只该有一种「图标带个数」的写法，两种并存读起来像两个不相干的东西。
  // 不带 `data-stop` 是有意的：让点击冒泡到整行，落到那首歌自己那一页 —— 评论正在那儿。
  return n ? `<span class="likebox"><span class="mini" role="button" title="${esc(T("commentsN", {n}))}">${ICON.bub}</span><span class="likes-n">${n}</span></span>` : "";
}

function renderComments(sh){
  if (!DATA.commentsOn) return "";          // 主人在后台关掉了：整块不画，数据还在盘上
  const rows = sh.comments || [];
  const draft = state.cmDraft || "";
  const left = 80 - [...draft].length;
  const list = rows.length
    ? `<div class="cm-list">` + rows.map(c => `<div class="cm-row">
        <div class="cm-m">
          <div class="cm-by"><b>${esc(c.byName || T("aFriend"))}</b> · ${esc(shortDate(new Date((c.at||0)*1000)))}</div>
          <div class="cm-t">${esc(c.text)}</div>
        </div>
        ${c.canDel ? `<span class="mini cm-del" data-cmdel="${esc(c.id)}" role="button" title="${esc(T("commentDel"))}">${ICON.trash}</span>` : ""}
      </div>`).join("") + `</div>`
    : `<p class="cm-none">${T("commentsNone")}</p>`;
  return `<div class="cm">
    <h3 class="cm-h">${T("commentsH")}${rows.length ? `<span class="n">· ${rows.length}</span>` : ""}</h3>
    <div class="cm-new">
      <textarea id="cm-in" rows="1" maxlength="80" placeholder="${esc(T("commentPh"))}"
        ${state.cmBusy ? "disabled" : ""}>${esc(draft)}</textarea>
      <button class="btn" id="cm-go" ${(state.cmBusy || !draft.trim()) ? "disabled" : ""}>${state.cmBusy ? T("commentSending") : T("commentSend")}</button>
    </div>
    <p class="cm-cap ${left <= 15 ? "near" : ""}">${left <= 15 ? left : ""}</p>
    ${list}</div>`;
}

/* 发一条。**成功之后才清草稿** —— 失败了那句话还在框里，用户不用重打一遍
   （同 likeCall 失败回滚那条手感）。 */
async function commentAdd(){
  const sh = (DATA.shared || []).find(x => x.sid === state.song);
  const text = (state.cmDraft || "").trim();
  if (!sh || !text || state.cmBusy) return;
  state.cmBusy = true; render();
  try {
    const r = await fetch("/api/comment?" + new URLSearchParams({op:"add", audio:sh.audio, text}),
                          {cache:"no-store"});
    if (!r.ok) throw new Error("comment " + r.status);
    state.cmDraft = "";
    await reloadData(await r.json());
  } catch (_) {
    toast(T("commentFailed"));
  }
  state.cmBusy = false; render();
}

/* 删一条。不弹确认：删自己的那句话，多一步问句是过度 —— 而且这个页面主要在手机上看，
   误触的代价是重打一句，不是丢掉一首歌（删歌那边才有确认，两者不是一个量级）。
   谁能删由服务端算好（`canDel`），这里只决定画不画按钮；真正的闸在 `_comment` 里。 */
async function commentDel(id){
  try {
    const r = await fetch("/api/comment?" + new URLSearchParams({op:"del", id}), {cache:"no-store"});
    if (!r.ok) throw new Error("comment " + r.status);
    await reloadData(await r.json());
  } catch (_) {
    toast(T("commentDelFailed"));
  }
  render();
}

function emptyBox(t, p, cta){
  // cta 两种：`tab` 是去别处，`clearTag` 是把筛选摘掉留在原地
  const btn = !cta ? "" : cta.clearTag
    ? `<button class="btn ghost" data-tagclear="1">${esc(cta.label)}</button>`
    : `<button class="btn ghost" data-tab="${cta.tab}">${esc(cta.label)}</button>`;
  return `<div class="empty"><h3>${esc(t)}</h3><p>${esc(p)}</p>${btn}</div>`;
}

/* ── 事件一处收口 ── */
document.addEventListener("click", (e) => {
  // 点到别处就把悬浮窗收起来 —— 它没有「确认」这一步，写完走人就存下了
  if (!e.target.closest("#pop") && !e.target.closest("[data-bub]") && !e.target.closest("[data-more]")) closePop();
  // 词 / 队列面板开着时点到空白处就收（isBlank）；面板和播放条自己身上的点击不算
  if ((state.lyrOpen || state.qOpen) && !e.target.closest(".dock,#pop") && isBlank(e.target)) closeDrawers();
  if (e.target.closest("#bubble")) { state.sheetOpen = !state.sheetOpen; renderSheet(); return; }
  // 气泡要赶在 data-stop 那道闸前面 —— 它自己就带 data-stop（免得顺手把整行的播放也点了）
  const bub = e.target.closest("[data-bub]");
  if (bub) { openPop(bub.dataset.bub, bub); return; }
  const more = e.target.closest("[data-more]");
  if (more) { const pop = $("pop"), i = more.dataset.more;    // 再点一次同一枚就收起
    if (!pop.hidden && pop.dataset.kind === "menu" && pop.dataset.take === i
        && pop.dataset.proj === String(state.project)) { closePop(true); return; }
    closePop(true); openMenu(+i, more); return; }
  const mi = e.target.closest("[data-menu]");
  if (mi) { const [act, i] = mi.dataset.menu.split(":");
    const pj = $("pop").dataset.proj != null ? +$("pop").dataset.proj : state.project;
    closePop(true);
    if (act === "refine") openRefine(pj, +i);
    else if (act === "lyrics" || act === "share") { state.project = pj; openPage(act, +i); }
    else if (act === "cover") coverUpload(+i);
    else if (act === "del") askDelete("take", pj, +i);       // 删除只到「问一句」为止
    else if (act === "delproj") askDelete("project", +i);
    return; }                                  // "close"（下载链接）：菜单收起，链接照常走
  const rf = e.target.closest("[data-refine-lyr]");
  if (rf) { refineLyrics(rf.dataset.refineLyr); return; }
  const dl2 = e.target.closest("[data-del]");
  if (dl2) { const [kind, pi, ti] = dl2.dataset.del.split(":");
    closePop(true);
    if (kind !== "cancel") delCall(kind === "delproj" ? "project" : kind, +pi, ti === "" ? null : +ti);
    return; }
  const pm = e.target.closest("[data-projmore]");            // 项目那一层的 ⋯
  if (pm) { const pop = $("pop"), i = pm.dataset.projmore;
    if (!pop.hidden && pop.dataset.kind === "menu" && pop.dataset.take == null
        && pop.dataset.proj === i) { closePop(true); return; }
    closePop(true); openProjectMenu(+i, pm); return; }                                  // "close"（下载链接）：菜单收起，链接照常走
  const sl = e.target.closest("[data-sharedlyr]");          // 单曲页的「词」：边放边看
  // 发现页的行上**没有**这枚了（PM 2026-09-21）：评论数进来之后行尾就是四枚，太挤 ——
  // 砍掉「词」给它让位。词没丢，点进那首歌自己那一页就在。
  if (sl) { const sh = DATA.shared[+sl.dataset.sharedlyr];
    if (!state.cur || state.cur.src !== sh.audio) { state.lyrOpen = true; state.qOpen = false; playShared(sh); }
    else openDrawer("lyr");
    syncRows(); return; }
  const qm = e.target.closest("[data-qmore]");               // 队列面板里那一行的 ⋯（同样要赶在 data-stop 闸前）
  if (qm) { const o = state.queue[+qm.dataset.qmore];
    if (o && o.refine) { const pop = $("pop");
      if (!pop.hidden && pop.dataset.kind === "menu" && pop.dataset.take === String(o.refine.t)
          && pop.dataset.proj === String(o.refine.p)) { closePop(true); return; }
      closePop(true); openMenu(o.refine.t, qm, o.refine.p); }
    return; }
  const es = e.target.closest("[data-editshare]");          // 发现页里改自己的分享（带 data-stop，要赶在闸前）
  if (es) { const k = takeOfShare(DATA.shared[+es.dataset.editshare]);
    if (k) { state.project = k.pi; openPage("share", k.ti, state.minePage || "discover"); } return; }
  const pl = e.target.closest("[data-playshared]");         // 行上的 ▶：只听这一首，不进它那一页
  if (pl) { playShared(DATA.shared[+pl.dataset.playshared]); return; }
  const lk = e.target.closest("[data-like]");                // ♥（行上 / 单曲页上是同一个）
  if (lk) {
    const sh = DATA.shared[+lk.dataset.like];
    if (sh && !sh.liked) {                                   // 点上才弹，取消不弹
      const el = lk.classList.contains("heart") ? lk : lk.querySelector(".heart");
      if (el) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
    }
    likeCall(sh); return;
  }
  const ref = e.target.closest("[data-refine]");
  if (ref) { const i = +ref.dataset.refine;                 // 精修是开关：再点一次就回项目
    isRefining(state.project, i) ? leaveRefine() : openRefine(state.project, i); return; }
  if (e.target.closest("[data-stop]")) return;   // 下载链接：别把整行的播放也触发了
  const t = e.target.closest("[data-tab],[data-nav],[data-opt],[data-proj],[data-play],[data-tagpick],[data-tagclear],[data-filteropen],[data-copy],[data-copylyr],[data-copydraft],[data-song],[data-copylink],[data-minepage],[data-lyr],[data-keepscore],[data-lplay],[data-closepop],[data-delnote],[data-backrefine],[data-step],[data-mode],[data-queue],[data-q],[data-way],[data-hum],[data-draw]");
  if (!t) return;
  const d = t.dataset;
  if (d.way != null) { state.create = d.way; state.quiz.step = Math.min(state.quiz.step, QUIZ.length - 1); go(); return; }
  if (d.hum != null) { humAction(d.hum); return; }
  if (d.draw != null) { drawAction(d.draw); return; }
  // 回「我分享的 / 我喜欢的」：原先只从发现页那边点得到，现在这一版的二级页也用它（见 discoverBack），
  // 所以 tab / page / project 一并交代 —— 只设 minePage 的话人还留在 mine 那边（同 openPage 那条判据）
  if (d.minepage != null) { state.tab = "discover"; state.minePage = d.minepage; state.song = null;
    state.page = null; state.project = null; state.refine = null; go(); return; }
  if (d.copylink != null) { copyText(location.href, T("linkCopied")); return; }
  // 开词要退出精修（精修页本身就是这一版的词），也要收起队列 —— 都在 openDrawer 里
  if (d.lyr != null) { openDrawer("lyr"); return; }
  if (d.queue != null) { openDrawer("queue"); return; }
  if (d.mode != null) { cycleMode(); return; }
  if (d.step != null) { +d.step < 0 ? goPrev() : advance(1); return; }
  if (d.q != null) { playAt(+d.q); return; }
  // 从这句听：往前留 0.3 秒 —— 位置本来就有一秒上下的不确定，正好落在句头而不是切进句中
  if (d.lplay != null) { const [, k] = refineTake(); const at = Math.max(0, +d.lplay - 0.3);
    if (!state.cur || state.cur.src !== k.audio) playTake(k, {at});
    else { seekTo(at); if (au.paused) au.play().catch(()=>{}); }
    return; }
  if (d.closepop != null) { closePop(); return; }
  if (d.delnote != null) { delete state.notes[d.delnote]; closePop(true); renderBubble(); render(); return; }
  if (d.backrefine != null && state.pending) {
    state.sheetOpen = false; openRefine(state.pending.p, state.pending.t); return; }
  if (d.keepscore != null) { state.keepScore = !state.keepScore;
    document.querySelectorAll("[data-keepscore]").forEach(b => b.setAttribute("aria-pressed", state.keepScore));
    renderSheet(); return; }
  if (d.copydraft != null) { copyText(draftText()); return; }
  if (d.copylyr != null) { const p = DATA.projects[state.project] || {};
    const k = state.page && (p.takes||[])[state.page.t], ly = (k && k.lyrics) || p.lyrics;
    copyText(ly ? lyricsText(ly) : ""); return; }
  if (d.copy != null) { copyText(d.copy); return; }
  if (d.tab != null) { state.tab = d.tab; state.project = null; state.refine = null; state.page = null;
    state.song = null; state.minePage = null; state.shareDone = false; go(); return; }
  if (d.opt != null) { const q = QUIZ[state.quiz.step], k = q.k;
    if (q.multi) { const cur = answerList(q);
      state.quiz.a[k] = cur.includes(d.opt) ? cur.filter(x => x !== d.opt) : [...cur, d.opt]; }
    else state.quiz.a[k] = state.quiz.a[k]===d.opt ? "" : d.opt;
    render(); return; }
  if (d.nav != null) {
    const ta = $("qa");
    if (ta && state.quiz.step < QUIZ.length) { const q = QUIZ[state.quiz.step], free = ta.value.trim();
      if (q.multi) { const kept = answerList(q).filter(x => q.opts.includes(x));   // 自己写的那条跟着输入框走
        state.quiz.a[q.k] = free ? [...kept, free] : kept; }
      else if (free) state.quiz.a[q.k] = free; }
    if (d.nav === "restart") state.quiz = {step:0,a:{}};        // 重答题；哼过的旋律留着（它是另一样东西）
    else if (d.nav === "dropmelody") state.melody = null;
    else if (d.nav === "back") { if (state.page) state.page = null; else state.project = null; go(); return; }
    else if (d.nav === "discover") { state.page = null; state.project = null; state.song = null;
      state.minePage = null; state.tab = "discover"; go(); return; }
    else if (d.nav === "unrefine") { leaveRefine(); return; }
    else if (d.nav === "skip") state.quiz.step++;
    else if (d.nav === "unshare") { const p = DATA.projects[state.project], k = state.page && p.takes[state.page.t];
      state.shareDone = false;
      if (k) { shareCall({op:"unset", audio:k.audio}).then(() => { state.share = {key:null}; render(); })
                 .catch(() => toast(T("unshareFailed"))); }
      return; }
    else state.quiz.step = Math.max(0, state.quiz.step + (+d.nav));
    render(); return; }
  // 「打开这个项目」：从「我的歌」的项目卡点，也从播放条左边那块点（那时人可能正站在发现页 /
  // 单曲页上）—— 所以 tab / song / minePage 都要一并交代，不能只设 project 就走。
  if (d.proj != null) { state.tab = "mine"; state.project = +d.proj; state.page = null;
    state.refine = null; state.song = null; state.minePage = null;
    state.shareDone=false; go(); return; }
  // 点一枚标签 = 加进 / 移出筛选（组合靠一枚一枚点出来）。
  // **从单曲页点是另一回事**：那是「我想听这一类」，一步到位换成只筛这一枚并回发现页。
  // 它也是筛选唯一的发现路径 —— 行上不画标签（四五枚 chip 会把一行挤垮），
  // 所以人得先进一首歌，才看见标签这回事。
  if (d.tagpick != null) {
    if (state.song || state.tab !== "discover") {
      state.tags = [d.tagpick]; state.filterOpen = false;
      state.tab = "discover"; state.song = null; state.minePage = null; go(); return;
    }
    state.tags = state.tags.includes(d.tagpick)
      ? state.tags.filter(x => x !== d.tagpick) : [...state.tags, d.tagpick];
    render(); return; }
  if (d.tagclear != null) { state.tags = []; render(); return; }
  if (d.filteropen != null) { state.filterOpen = !state.filterOpen; render(); return; }
  if (d.play != null) { const p = DATA.projects[state.project], k = p.takes[+d.play];
    playTake(k); return; }
  if (d.song != null) { openSong(d.song); return; }
});

/* 分享落在她工作区的 shared.json（serve.py /api/share，纯 GET）：刷新、换端都还在。
   服务端回整份 data，直接换上 —— 行上的「已分享」和发现页一次到位。 */
async function shareCall(q){
  const r = await fetch("/api/share?" + new URLSearchParams(q), {cache:"no-store"});
  if (!r.ok) throw new Error("share " + r.status);
  await reloadData(await r.json());
}
document.addEventListener("input", (e) => {
  if (e.target.id !== "cm-in") return;
  state.cmDraft = e.target.value;
  // 就地更新，**不 render** —— 每敲一个字就重建整页的话，光标会被打回开头。
  const left = 80 - [...e.target.value].length, cap = document.querySelector(".cm-cap");
  if (cap) { cap.textContent = left <= 15 ? left : ""; cap.classList.toggle("near", left <= 15); }
  const go = $("cm-go"); if (go) go.disabled = !e.target.value.trim();
});

document.addEventListener("click", (e) => {
  if (e.target.closest("#cm-go")) { commentAdd(); return; }
  const del = e.target.closest("[data-cmdel]");
  if (del) commentDel(del.dataset.cmdel);
});

document.addEventListener("click", async (e) => {
  if (!e.target.closest("#sh-go")) return;
  const p = DATA.projects[state.project], k = state.page && p.takes[state.page.t];
  if (!k) return;
  const s = shareFor(k);
  s.title = ($("sh-title")||{}).value || p.title;
  s.desc  = ($("sh-desc")||{}).value || "";
  state.shareBusy = true; render();
  try {
    await shareCall({op:"set", audio:k.audio, title:s.title, desc:s.desc});
    state.shareDone = true; setTimeout(() => { state.shareDone = false; render(); }, 2600);
  } catch { toast(T("shareFailed")); }
  state.shareBusy = false; state.share = {key:null}; render();
});

/* 键盘：空格播放/暂停，左右 5 秒，数字键切版本（桌面工作台，design.md §4.3） */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePop(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey || !state.cur) return;
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.shiftKey && e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  else if (e.shiftKey && e.key === "ArrowRight") { e.preventDefault(); advance(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); seekTo(Math.max(0, au.currentTime - 5)); }
  else if (e.key === "ArrowRight") { e.preventDefault(); seekTo(Math.min(Math.max(0, (curDur()||0) - .5), au.currentTime + 5)); }
  else if (/^[1-9]$/.test(e.key)) { const x = versionList(state.cur).find(x => x.v === +e.key); if (x) switchTake(x.i); }
});

/* 手机上播放条没有上/下一首那两枚（塞不下，design.md §4.3）：左右滑它。
   进度条自己捕获指针（窄屏它是贴顶的那条线），按钮也让开 —— 滑的是播放条本身。 */
(() => {
  const bar = $("bar"); let x0 = null, y0 = null, ok = false, swipedAt = 0;
  // 滑完浏览器多半自己就不派 click 了（位移超过 tap slop），但别指望它：左边那块现在是
  // 一个入口，判错的后果是「想切歌，结果跳了页」。在捕获阶段自己拦一道。
  bar.addEventListener("click", (e) => {
    if (Date.now() - swipedAt < 400 && e.target.closest(".bar-nav")) e.stopPropagation();
  }, true);
  bar.addEventListener("touchstart", (e) => {
    const t = e.target;
    ok = state.queue.length > 1 && !!t.closest && !t.closest("button") && !t.closest(".seek");
    if (!ok) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive: true});
  bar.addEventListener("touchend", (e) => {
    if (!ok || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) swipedAt = Date.now();      // 动过就不是点了
    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;   // 竖着滑是在滚页面，不是切歌
    dx < 0 ? advance(1) : goPrev();
  }, {passive: true});
})();

/* ── 数据刷新：这一页是「看她干活」的窗，不能停在打开那一刻 ──
   卡片常在生成前就发出；容器又会复用已开着的窗 / 保活的 webview —— 再点一张同 host 的卡，
   浏览器走的是同文档跳转（只换 #，不重新请求 HTML），同一条卡再点甚至只是把窗置前；
   页面收不到任何「你被重新打开了」的信号（handoff §10，2026-09-17 复盘）。所以刷新是页面自己的事：
     · 路由一变（hashchange）→ 重取；
     · 窗口回到前台 / 重新可见（focus / visibilitychange / pageshow）→ 重取；
     · 可见期间每 15 秒问一次盘上有没有新东西；有歌在路上时每 3 秒问 /api/busy。
   重取只在内容真变了才重画，别把正在听歌 / 正在写建议的人晃一下。
   「生成中」以服务端读到的等待标记为准（按 slug 挂在项目上）：标记消失 = sidecar 已落盘
   （gen_song.py 先写 sidecar 再删标记），整份重取一次，新版本就位 —— 不再需要「收尾」那套猜测。 */
let busyTimer = null, idleTimer = null, refreshing = null, lastRefreshAt = 0, queuedReason = null;
const IDLE_MS = 15000, BUSY_MS = 3000, MIN_GAP_MS = 1500;
function anyBusy(){ return (DATA.projects||[]).some(p => (p.busy||[]).some(j => !j.failed)); }
function busyKeys(){
  return new Set((DATA.projects||[]).flatMap(p => (p.busy||[]).filter(j => !j.failed).map(j => p.slug + ":" + j.seed)));
}
/* 返回 true = 有在途行属于手头还没有的项目（她刚开的新项目），得整份重取才显示得出来 */
function applyBusy(list){
  const known = new Set((DATA.projects||[]).map(p => p.slug));
  (DATA.projects||[]).forEach(p => p.busy = list.filter(j => j.slug === p.slug));
  return list.some(j => !known.has(j.slug));
}
/* 内容指纹：项目 / 版本 / 分享 / 在途行的**状态**，不含每秒都在变的 elapsed */
function fingerprint(){
  return JSON.stringify([(DATA.projects||[]).map(p => [p.slug, p.title,
      (p.takes||[]).map(t => [t.id, t.v, t.shared, t.sharedTitle, t.sharedDesc]),
      (p.busy||[]).map(j => [j.version, j.stage, j.queued, j.failed, j.error])]),
    (DATA.shared||[]).map(x => [x.audio, x.title, x.desc])]);
}
function refreshData(reason){
  // 路由刚变 / 有歌刚落盘 / 还有链接没落到位：不节流；后台的 tick / focus 之类才受 1.5 秒间隔约束
  const urgent = reason === "hash" || reason === "landed" || pendingHash != null;
  if (refreshing) { if (urgent) queuedReason = reason; return refreshing; }
  if (!urgent && Date.now() - lastRefreshAt < MIN_GAP_MS) return Promise.resolve();
  refreshing = (async () => {
    const before = fingerprint();
    await reloadData();
    lastRefreshAt = Date.now();
    let landed = false;
    if (pendingHash && pendingHash === location.hash) {   // 上次没落到位的深链接，现在再试一次
      applyRoute(location.hash); landed = pendingHash == null;
    }
    if (landed || fingerprint() !== before) render();
    else watchBusy();
  })().finally(() => {
    refreshing = null;
    if (queuedReason) { const r = queuedReason; queuedReason = null; refreshData(r); }
  });
  return refreshing;
}
function watchBusy(){
  if (busyTimer || !anyBusy()) return;
  busyTimer = setInterval(async () => {
    let r;
    try { r = await (await fetch("/api/busy", {cache:"no-store"})).json(); }
    catch { return; }                       // 网络抖一下就跳过这一轮，别把界面清空
    const before = busyKeys();
    const unknown = applyBusy(r.busy || []);
    const after = busyKeys();
    const landed = [...before].some(k => !after.has(k));   // 有标记消失 = 那一首已落盘（或已判失败）
    if (!anyBusy()) { clearInterval(busyTimer); busyTimer = null; }
    if (landed || unknown) {
      // 两首并行时先落盘的那首得立刻出现，不等第二首；她刚开的新项目也一样
      await refreshData("landed");
      return;
    }
    render();
  }, BUSY_MS);
}
function watchIdle(){
  if (idleTimer) return;
  idleTimer = setInterval(() => {
    if (document.visibilityState !== "visible" || anyBusy()) return;   // 在途时由 watchBusy 管
    refreshData("tick");
  }, IDLE_MS);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshData("visible"); });
window.addEventListener("focus", () => refreshData("focus"));
window.addEventListener("pageshow", (e) => { if (e.persisted) refreshData("pageshow"); });
async function reloadData(given){
  const p0 = state.project != null ? DATA.projects[state.project] : null;
  const keep = {slug: p0 ? p0.slug : null,
                takeId: state.refine ? (refineTake()[1]||{}).id : state.page && p0 ? ((p0.takes||[])[state.page.t]||{}).id : null,
                kind: state.refine ? "refine" : state.page && state.page.kind,
                pendingKey: state.pending && state.pending.key};
  let fresh = given;
  if (!fresh) {
    /* 带上手里这份的指纹：服务端算出来一样就只回一句「没变」（约 20 字节），不再白发 37 KB。
       2026-09-20 实测：一天 1829 次轮询里只有 20 次内容真的变了。判据走查询串而不是
       ETag / If-None-Match —— /api/* 一律 no-store，客户端根本不存，也就带不回条件头。 */
    const u = "/api/data" + (DATA.v ? "?v=" + encodeURIComponent(DATA.v) : "");
    try { fresh = await (await fetch(u, {cache:"no-store"})).json(); } catch { return; }
    if (fresh && fresh.unchanged) return;   // 盘上没动：DATA 一个字不碰，调用方的 fingerprint 自然也不变
  }
  Object.assign(DATA, fresh);
  if (keep.slug != null) {
    const i = DATA.projects.findIndex(p => p.slug === keep.slug);
    state.project = i >= 0 ? i : null;
    if (i >= 0 && keep.takeId) {
      const t = (DATA.projects[i].takes||[]).findIndex(x => x.id === keep.takeId);
      if (keep.kind === "refine") {
        state.refine = t >= 0 ? {p:i, t} : null;
        if (t >= 0 && state.pending && state.pending.key === keep.pendingKey)
          state.pending = {...state.pending, p:i, t};
      } else state.page = t >= 0 ? {kind: keep.kind, t} : null;
    }
  }
}

/* 换页方向：tab 顺序（首页 → 创作 → 我的歌 → 发现）决定左右；同一 tab 里路径更深 = 前进、更浅 = 后退；
   同一深度的兄弟（我分享的 ↔ 我喜欢的、词 ↔ 分享）当前进。项目页归「我的歌」，单曲页归「发现」。 */
const TAB_ORDER = ["home", "create", "mine", "discover"];
function routeInfo(r){
  const seg = (r || "/").split("/").filter(Boolean);
  const tab = seg[0] === "p" ? "mine" : seg[0] === "s" ? "discover" : (seg[0] || "home");
  return {tab: TAB_ORDER.indexOf(tab), depth: seg.length};
}
function routeDir(a, b){
  const A = routeInfo(a), B = routeInfo(b);
  if (A.tab !== B.tab) return B.tab > A.tab ? 1 : -1;
  return B.depth < A.depth ? -1 : 1;
}
const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
/* 每条路由记住自己滚到哪（PM 2026-09-21）：**回到去过的地址就落回原处，第一次到的从顶上开始**。
   列表 → 详情 → 返回是这一页最常走的一条路（发现页那一列可以很长），每次都被扔回顶部等于
   「看到哪儿」这件事从头再来一遍。不按前进 / 后退分（`routeDir` 是给动效用的：同深度的兄弟
   算前进，于是「我分享的 → 单曲页 → 我分享的」会被判成前进），按**去没去过**分 —— 顺带
   「发现 ↔ 我的歌」来回切也各自留在原处，那本来就是 tab 该有的样子。
   只记滚过的（>0），回了顶就把记录删掉。内容变了位置只能大致对上，那是这类记忆共同的妥协。 */
const scrollMemo = new Map();
function rememberScroll(route, y){ y > 0 ? scrollMemo.set(route, y) : scrollMemo.delete(route); }
const recallScroll = (route) => scrollMemo.get(route) || 0;
let lastRoute = null, lastTune = "", pendingRender = false;
function render(force){
  if (!force && tuneLocked()) { pendingRender = true; return; }   // 一笔 / 一段录音进行中：攒着，结束再画
  pendingRender = false;
  const cmFocused = document.activeElement && document.activeElement.id === "cm-in";
  renderTop();
  const route = routeOf(), moved = route !== lastRoute;
  if (moved && lastRoute != null) {
    state.lyrOpen = false; state.qOpen = false;                                    // 换了界面就收起抽屉（PM 2026-09-16；队列面板同理）
    rememberScroll(lastRoute, $("scroller").scrollTop);                            // 离开这一页之前，记下看到哪儿了
  }
  const dir = moved && lastRoute != null && !reducedMotion() ? routeDir(lastRoute, route) : 0;   // 首屏直出，不演
  lastRoute = route;
  // 离开哼 / 画那一屏就把录音机、试听全停掉、状态清零 —— 活对象不跟着路由活
  const tune = state.tab === "create" && (state.create === "hum" || state.create === "draw") ? state.create : "";
  if (tune !== lastTune && lastTune) tuneLeave();
  lastTune = tune;
  const view = $("view"), scroller = $("scroller");
  const body =
    state.tab === "home"     ? renderHome() :
    state.tab === "create"   ? renderCreate() :
    state.song               ? renderSong() :
    state.tab === "discover" ? (state.minePage ? renderMineList() : renderDiscover()) : renderMine();
  const way = dir > 0 ? "dir-fwd" : "dir-back";
  /* 同一屏里换子页（创作页那三个页签，handoff §40）：外壳（大标题 + 页签行）在三屏里一模一样，
     让它跟着整页一起滑，屏幕上就是**两份相同的字错开 28px 交叉淡化** —— PM 2026-09-21 说的
     跳跃感正是它，不是滑动本身。所以外壳的 DOM 一动不动（只把页签的选中态改过去），
     滑的只有下面那块 `.swap`。答完题那一屏没有外壳（`renderSeed`），自然落回整页动效。 */
  const cur = view.firstElementChild;
  const oldSwap = dir && cur && cur.querySelector(".ttabs") ? cur.querySelector(".swap") : null;
  const fresh = (() => {
    if (!oldSwap) return null;
    const tmp = document.createElement("div"); tmp.innerHTML = body;
    return tmp.querySelector(".ttabs") ? tmp.querySelector(".swap") : null;
  })();
  if (fresh) {
    cur.querySelectorAll(".ttab").forEach(b =>
      b.setAttribute("aria-selected", String(b.dataset.way === state.create)));
    // 位置量出来写死在 style 上：`.swap` 的定位祖先是谁要看页面结构，量过就不用猜
    const op = oldSwap.offsetParent || view, r = oldSwap.getBoundingClientRect(), pr = op.getBoundingClientRect();
    oldSwap.style.cssText = `position:absolute;top:${r.top - pr.top}px;left:${r.left - pr.left}px;width:${r.width}px`;
    oldSwap.className = "swap out " + way;
    fresh.className = "swap in " + way;
    oldSwap.after(fresh);
    /* 旧块不许比新块高（2026-09-22，PM 报的残影）。
       旧块是绝对定位、脱了文档流的，而新块的底色**只铺它自己那么高** —— `.swap.in` 那两条
       box-shadow 补的是左右两侧（位移只有 28px），垂直方向一点都没补。于是新块一旦比旧块矮，
       旧块高出来的那一截谁也盖不住，就那么留在屏幕上：画一段 398px 换到哼一段 234px，
       底下 164px 的画布网格和那排按钮原样挂着（实测）。
       裁旧块，不是撑高新块：旧块正在滑走，底部被裁看不出来；而给新块加 min-height，
       动画收尾时它会塌一下 —— 那是拿一个跳换掉另一个跳。 */
    const freshH = fresh.getBoundingClientRect().height;
    if (freshH && r.height > freshH) {
      oldSwap.style.height = freshH + "px";
      oldSwap.style.overflow = "hidden";
    }
    // 一次收尾，顺序要紧：新块靠 `.in` 的 z-index + 底色盖住旧块，**清类必须晚于旧块离场** ——
    // 先清类的话，动画完到旧块被移走之间那几十毫秒里，绝对定位的旧块会重新压上来（真出过一帧）
    setTimeout(() => { oldSwap.remove(); fresh.className = "swap"; }, 300);
  } else {
    // 旧页摘下来留住：滑出期间它绝对定位在原处（top 抵消马上要变的滚动），演完再扔
    const old = dir ? cur : null;
    if (old) { old.remove(); old.className = "page out " + way; old.style.top = -scroller.scrollTop + "px"; }
    view.innerHTML = `<div class="page ${dir > 0 ? "in dir-fwd" : dir < 0 ? "in dir-back" : ""}">` + body + `</div>`;
    if (old) { view.appendChild(old); setTimeout(() => old.remove(), 260); }
  }
  if (moved) scroller.scrollTo(0, recallScroll(route));
  if (tune) drawCreateCanvas();
  renderBar();
  renderBubble();
  watchBusy();
  if (pendingTake != null) { const ti = pendingTake; pendingTake = null; landOnTake(ti); }
  if (cmFocused) { const el = $("cm-in"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  if (!state.refine) return;
  const box = document.querySelector(".scorebox");
  if (box) box.ontoggle = () => drawScores();
  drawScores();
}
document.addEventListener("toggle", async ({target}) => {
  if (!target.matches("details[data-score][open]") || target.dataset.drawn) return;
  target.dataset.drawn = "1";
  const host = target.querySelector(".abcbox");
  host.textContent = T("scoreLoading");
  try {
    const response = await fetch(target.dataset.score);
    if (response.status === 404) { host.textContent = T("refineNoScore"); return; }
    if (!response.ok) throw new Error("Score unavailable");
    const abc = await response.text(), renderer = await loadScoreLibrary();
    host.textContent = "";
    renderer.renderAbc(host, abc, {responsive:"resize"});
  } catch {
    delete target.dataset.drawn;
    host.textContent = T("refineFailed");
  }
}, true);
applyRoute(location.hash || DATA.route);
render();
watchIdle();
</script></body></html>
